<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPage — Business Profile Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161A20; --paper:#EEF1F6; --panel:#FFFFFF;
  --line:#DADFE8; --muted:#6B7280;
  --brass:#C8842A; --teal:#2F6F6B; --plum:#6E4C6B;
  --danger:#B3402E;
  --radius-lg:18px; --radius-md:12px; --radius-sm:8px;
  --font-head:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#ECEEF3; --paper:#14171D; --panel:#1B1F27;
    --line:#2B313D; --muted:#8B93A3;
  }
}
:root[data-theme="dark"]{
  --ink:#ECEEF3; --paper:#14171D; --panel:#1B1F27;
  --line:#2B313D; --muted:#8B93A3;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.head{font-family:var(--font-head); font-weight:600; letter-spacing:-0.01em; margin:0;}
button{font-family:inherit;}
a{color:inherit;}
input,select,textarea{font-family:inherit; font-size:15px;}
::selection{background:var(--brass); color:#fff;}

/* ---------- Top chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:20;
  padding:14px 20px calc(14px); padding-top:calc(14px + env(safe-area-inset-top,0px));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer;}
.brand .mark{
  width:30px; height:30px; border-radius:9px;
  background:linear-gradient(135deg, var(--brass), var(--plum));
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-head); font-weight:700; font-size:15px;
}
.brand .name{font-family:var(--font-head); font-weight:600; font-size:17px;}
.topbar-actions{display:flex; gap:8px;}

.container{max-width:920px; margin:0 auto; padding:24px 20px 80px;}

/* ---------- Buttons ---------- */
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:10px 16px; border-radius:10px; font-size:14px; font-weight:600;
  cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap;
  transition:transform .08s ease, border-color .15s ease;
}
.btn:active{transform:scale(0.97);}
.btn:hover{border-color:var(--muted);}
.btn-primary{background:var(--brass); border-color:var(--brass); color:#fff;}
.btn-primary:hover{border-color:var(--brass); filter:brightness(1.06);}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-danger{color:var(--danger); border-color:color-mix(in srgb, var(--danger) 40%, var(--line));}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px;}
.btn-block{width:100%; justify-content:center;}
.btn[disabled]{opacity:.5; cursor:not-allowed;}
.icon-btn{
  width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--panel);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
}

/* ---------- Cards / panels ---------- */
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:22px;}
.card + .card{margin-top:16px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:6px;}
.field input[type=text], .field input[type=url], .field input[type=tel], .field input[type=email],
.field input[type=number], .field input[type=date], .field input[type=time], .field textarea, .field select{
  width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); outline:none;
}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--brass);}
.hint{font-size:12.5px; color:var(--muted); margin-top:6px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:560px){.row2{grid-template-columns:1fr;}}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;}
.tab{
  padding:9px 15px; border-radius:999px; font-size:13.5px; font-weight:600; color:var(--muted);
  background:transparent; border:1px solid var(--line); cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---------- Dashboard ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:16px;}
.profile-card{
  border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; background:var(--panel);
  display:flex; flex-direction:column;
}
.profile-card .swatch{height:64px;}
.profile-card .pc-body{padding:16px; flex:1; display:flex; flex-direction:column; gap:4px;}
.profile-card .pc-logo{
  width:44px; height:44px; border-radius:12px; margin-top:-38px; border:3px solid var(--panel);
  background:var(--paper); display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden;
}
.profile-card .pc-logo img{width:100%; height:100%; object-fit:cover;}
.pc-name{font-family:var(--font-head); font-weight:600; font-size:16px; margin-top:6px;}
.pc-meta{font-size:12.5px; color:var(--muted);}
.pc-status{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.pc-status.live{color:var(--teal);}
.pc-status.locked{color:var(--brass);}
.pc-actions{display:flex; gap:6px; padding:12px 16px; border-top:1px solid var(--line); flex-wrap:wrap;}
.new-card{
  border:1.5px dashed var(--line); border-radius:var(--radius-lg); display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; min-height:170px; cursor:pointer; color:var(--muted); background:transparent;
}
.new-card:hover{border-color:var(--brass); color:var(--brass);}
.new-card .plus{font-size:26px; font-family:var(--font-head);}

.empty{text-align:center; padding:60px 20px; color:var(--muted);}
.empty h2{color:var(--ink); margin-bottom:8px;}

/* ---------- Link/Service rows ---------- */
.item-row{
  display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px;
  background:var(--paper);
}
.item-row .ic{width:34px; height:34px; border-radius:9px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.item-row .info{flex:1; min-width:0;}
.item-row .t1{font-weight:600; font-size:14px;}
.item-row .t2{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-row .acts{display:flex; gap:6px; flex-shrink:0;}

.addbar{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px;}
.chip{
  padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-size:13px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.chip:hover{border-color:var(--brass); color:var(--brass);}

/* ---------- Theme picker ---------- */
.theme-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr)); gap:12px;}
.theme-swatch{
  border-radius:14px; height:76px; cursor:pointer; border:2px solid transparent; position:relative; overflow:hidden;
  display:flex; align-items:flex-end; padding:8px;
}
.theme-swatch.selected{border-color:var(--ink);}
.theme-swatch span{font-size:11.5px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.4);}
.color-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.color-row input[type=color]{width:40px; height:40px; border-radius:9px; border:1px solid var(--line); padding:2px; background:var(--panel); cursor:pointer;}
.color-row .lbl{font-size:13.5px; font-weight:600; flex:1;}
.style-toggle{display:flex; gap:8px;}
.style-toggle .chip.selected{background:var(--ink); color:var(--paper); border-color:var(--ink);}

/* ---------- Share panel ---------- */
.link-box{
  display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:12px; padding:10px 12px; background:var(--paper);
}
.link-box input{flex:1; border:none; background:transparent; outline:none; font-size:13px; color:var(--muted); font-family:monospace;}
.status-banner{
  display:flex; align-items:center; gap:10px; padding:12px 14px; border-radius:12px; font-size:13.5px; font-weight:600; margin-bottom:16px;
}
.status-banner.locked{background:color-mix(in srgb, var(--brass) 15%, transparent); color:var(--brass);}
.status-banner.info{background:color-mix(in srgb, var(--teal) 12%, transparent); color:var(--teal);}

/* ---------- Public profile page ---------- */
.profile-shell{min-height:100%; padding:0 0 60px;}
.profile-hero{padding:56px 20px 40px; text-align:center; position:relative;}
.profile-logo{
  width:88px; height:88px; border-radius:24px; margin:0 auto 16px; overflow:hidden;
  display:flex; align-items:center; justify-content:center; font-size:36px; font-family:var(--font-head); font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.profile-logo img{width:100%; height:100%; object-fit:cover;}
.profile-name{font-family:var(--font-head); font-weight:700; font-size:26px; margin-bottom:6px;}
.profile-tagline{font-size:15px; opacity:.85; max-width:420px; margin:0 auto;}
.profile-body{max-width:480px; margin:0 auto; padding:0 20px;}
.profile-bio{font-size:14.5px; line-height:1.6; opacity:.9; text-align:center; margin-bottom:28px;}
.link-list{display:flex; flex-direction:column; gap:11px; margin-bottom:32px;}
.link-btn{
  display:flex; align-items:center; gap:13px; padding:14px 16px; border-radius:14px; text-decoration:none;
  font-weight:600; font-size:14.5px; transition:transform .1s ease;
}
.link-btn:active{transform:scale(0.98);}
.link-btn .ic{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(255,255,255,.18);}
.section-title{font-family:var(--font-head); font-weight:600; font-size:17px; margin-bottom:14px;}
.book-card{border-radius:16px; padding:18px; margin-bottom:20px;}
.svc-pick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
.svc-opt{
  padding:9px 13px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; border:1.5px solid rgba(255,255,255,.35);
}
.svc-opt.selected{background:rgba(255,255,255,.9); color:#111;}
.slot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; margin:10px 0 14px;}
.slot{padding:9px 4px; text-align:center; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; border:1.5px solid rgba(255,255,255,.35);}
.slot.selected{background:rgba(255,255,255,.9); color:#111;}
.pf-input{width:100%; padding:12px; border-radius:10px; border:1.5px solid rgba(255,255,255,.35); background:rgba(255,255,255,.12); color:inherit; margin-bottom:10px; outline:none;}
.pf-input::placeholder{color:inherit; opacity:.65;}
.book-submit{width:100%; padding:13px; border-radius:11px; font-weight:700; font-size:14.5px; border:none; cursor:pointer;}
.foot-mark{text-align:center; font-size:11.5px; opacity:.5; margin-top:30px;}
.center-msg{max-width:380px; margin:120px auto; text-align:center; padding:0 24px;}
.center-msg .em{font-size:40px; margin-bottom:14px;}

.modal-overlay{position:fixed; inset:0; background:rgba(10,12,16,.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
.modal{background:var(--panel); border-radius:18px; padding:24px; max-width:380px; width:100%;}
.modal h3{margin-bottom:10px;}
.modal p{font-size:13.5px; color:var(--muted); margin:0 0 18px;}
.modal .acts{display:flex; gap:10px; justify-content:flex-end;}

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
  transition:all .25s ease; z-index:200; pointer-events:none;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.scroller{overflow-x:auto;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================= DATA / UTILS ============================= */
const STORE_KEY = 'mepage_profiles_v1';
const uid = () => Math.random().toString(36).slice(2,9);

function loadAll(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ return {}; } }
function saveAll(all){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(all)); }catch(e){} }
function saveProfile(p){ const all = loadAll(); p.updatedAt = Date.now(); all[p.id] = p; saveAll(all); }
function deleteProfile(id){ const all = loadAll(); delete all[id]; saveAll(all); }

function encodeProfile(p){ return encodeURIComponent(JSON.stringify(p)); }
function decodeProfile(str){ return JSON.parse(decodeURIComponent(str)); }

/* Builds the share link from wherever this page is actually hosted
   (your own domain, GitHub Pages, Netlify, etc). Whatever URL is in the
   address bar when someone opens this file is the correct public base. */
function shareUrl(p){ return location.origin + location.pathname + '#p=' + encodeProfile(p); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function copyText(str){
  navigator.clipboard?.writeText(str).then(()=>toast('Link copied')).catch(()=>{
    const ta=document.createElement('textarea'); ta.value=str; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast('Link copied');
  });
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function newProfile(){
  return {
    id: uid(), slug: uid(),
    businessName: '', tagline: '', bio: '',
    logoUrl: '', logoInitial: '',
    industry: 'general',
    theme: { primary:'#C8842A', secondary:'#6E4C6B', bg:'#171A21', text:'#FFFFFF', style:'gradient' },
    links: [],
    services: [], availability: { days:[1,2,3,4,5], start:'09:00', end:'17:00', slot:30 },
    locked:false, deleted:false,
    createdAt: Date.now(), updatedAt: Date.now()
  };
}

/* ============================= REFERENCE DATA ============================= */
const THEME_PRESETS = [
  {name:'Midnight Brass', primary:'#C8842A', secondary:'#6E4C6B', bg:'#171A21', text:'#FFFFFF', style:'gradient'},
  {name:'Ocean Teal',     primary:'#2F6F6B', secondary:'#0E3B39', bg:'#0E3B39', text:'#FFFFFF', style:'gradient'},
  {name:'Rose Clay',      primary:'#B3402E', secondary:'#E8A33D', bg:'#2A1815', text:'#FFFFFF', style:'gradient'},
  {name:'Orchid Dusk',    primary:'#6E4C6B', secondary:'#C8842A', bg:'#241726', text:'#FFFFFF', style:'gradient'},
  {name:'Paper & Ink',    primary:'#161A20', secondary:'#6B7280', bg:'#F4F2EC', text:'#161A20', style:'solid'},
  {name:'Sage Studio',    primary:'#3F5B45', secondary:'#8FAE8B', bg:'#EFF2EA', text:'#26301F', style:'solid'},
  {name:'Slate Mono',     primary:'#2B313D', secondary:'#6B7280', bg:'#EEF1F6', text:'#161A20', style:'solid'},
  {name:'Golden Hour',    primary:'#E8A33D', secondary:'#B3402E', bg:'#221507', text:'#FFFFFF', style:'gradient'},
];

const LINK_TYPES = {
  facebook:  {label:'Facebook',  ph:'facebook.com/yourpage', icon:'globe'},
  instagram: {label:'Instagram', ph:'instagram.com/yourhandle', icon:'camera'},
  tiktok:    {label:'TikTok',    ph:'tiktok.com/@yourhandle', icon:'note'},
  whatsapp:  {label:'WhatsApp',  ph:'+63 900 000 0000', icon:'chat'},
  phone:     {label:'Phone',     ph:'+63 900 000 0000', icon:'phone'},
  email:     {label:'Email',     ph:'you@business.com', icon:'mail'},
  website:   {label:'Website',   ph:'yourbusiness.com', icon:'globe'},
  custom:    {label:'Other link',ph:'https://…', icon:'link'},
};
const ICONS = {
  globe:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 3 2.7 15 0 18M12 3c-2.7 3-2.7 15 0 18"/></svg>',
  camera:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8 7l1.4-2.4h5.2L16 7"/></svg>',
  note:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l10-2v13"/><circle cx="7" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 1 1-3.6-6.7L21 4l-1.1 3.9A7.96 7.96 0 0 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/></svg>',
  phone:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v4c0 1-1 2-2 2A16 16 0 0 1 2 6c0-1 1-2 2-2Z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>',
  link:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 15l6-6M8 13l-2.5 2.5a3.5 3.5 0 0 0 5 5L13 18M16 11l2.5-2.5a3.5 3.5 0 0 0-5-5L11 6"/></svg>',
  lock:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>',
  unlock:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 7.4-2.1"/></svg>',
  trash:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>',
  copy:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M5 15.5H4.5A1.5 1.5 0 0 1 3 14V4.5A1.5 1.5 0 0 1 4.5 3H14a1.5 1.5 0 0 1 1.5 1.5V5"/></svg>',
  refresh:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v5h5M20 20v-5h-5"/><path d="M4.6 15a8 8 0 0 0 14.2 2.4M19.4 9A8 8 0 0 0 5.2 6.6"/></svg>',
  eye:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
  edit:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l.9-3.9L16.5 4.4a1.5 1.5 0 0 1 2.1 0l1 1a1.5 1.5 0 0 1 0 2.1L8 19.1 4 20Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
};
function icon(name, size){ return ICONS[name] ? ICONS[name].replace(/width="17" height="17"/,`width="${size||17}" height="${size||17}"`) : ''; }

function linkHref(type, value){
  value = (value||'').trim();
  if(!value) return '#';
  if(type==='phone') return 'tel:' + value.replace(/[^+\d]/g,'');
  if(type==='whatsapp') return 'https://wa.me/' + value.replace(/[^\d]/g,'');
  if(type==='email') return value.includes('@') ? 'mailto:'+value : value;
  if(/^https?:\/\//i.test(value)) return value;
  return 'https://' + value;
}

const INDUSTRY_PRESETS = {
  general:   {label:'General / Other', services:[]},
  salon:     {label:'Salon & Beauty', services:[{name:'Haircut', duration:45, price:''},{name:'Hair Color', duration:120, price:''},{name:'Manicure', duration:40, price:''}]},

/* ============================= ROUTER ============================= */
function route(){
  const hash = location.hash;
  const app = document.getElementById('app');
  if(hash.startsWith('#p=')){
    try{
      const p = decodeProfile(hash.slice(3));
      renderPublicPage(app, p);
    }catch(e){
      renderError(app);
    }
    return;
  }
  const m = hash.match(/^#edit\/(.+)$/);
  if(m){
    const all = loadAll();
    const p = all[m[1]];
    if(p){ renderEditor(app, p); return; }
  }
  renderDashboard(app);
}
window.addEventListener('hashchange', route);

/* ============================= TOPBAR ============================= */
function topbar(opts){
  opts = opts || {};
  return `
  <div class="topbar">
    <div class="brand" onclick="location.hash=''">
      <div class="mark">M</div>
      <div class="name">MyPage</div>
    </div>
    <div class="topbar-actions">${opts.right||''}</div>
  </div>`;
}

/* ============================= MODAL / TOAST HELPERS ============================= */
function showModal(inner){
  let ov = document.getElementById('modalOv');
  if(!ov){ ov = document.createElement('div'); ov.id='modalOv'; ov.className='modal-overlay'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="modal">${inner}</div>`;
  ov.onclick = (e)=>{ if(e.target===ov) closeModal(); };
}
function closeModal(){ const ov = document.getElementById('modalOv'); if(ov) ov.remove(); }

/* ============================= EDITOR ============================= */
let editorTab = 'profile';
function renderEditor(app, p){
  app.innerHTML = topbar({right:`
    <button class="btn btn-sm" onclick="window.open(shareUrl(loadAll()['${p.id}']),'_blank')">${icon('eye',13)} Preview</button>
    <button class="btn btn-sm btn-primary" onclick="location.hash=''">Done</button>

    <div class="tabs scroller" id="tabs">
      ${['profile','links','theme','booking','share'].map(t=>`<div class="tab ${editorTab===t?'active':''}" data-tab="${t}">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}
    </div>
    <div id="tabBody"></div>
  </div>`;

  document.querySelectorAll('#tabs .tab').forEach(el=>{

  });

/* ---- wire simple inputs (debounced autosave) ---- */
function wireTabEvents(p){
  const bind = (id, key, transform)=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('input', debounce(()=>{
      updateProfile(p.id, {[key]: transform ? transform(el.value) : el.value});
    }, 300));
  };
  bind('f_name','businessName'); bind('f_tag','tagline'); bind('f_bio','bio'); bind('f_logo','logoUrl');
  const ind = document.getElementById('f_industry');
  if(ind) ind.addEventListener('change', ()=>{
    const preset = INDUSTRY_PRESETS[ind.value];
    const cur = loadAll()[p.id];
    const patch = {industry: ind.value};
    if(cur.services.length===0 && preset.services.length){
      patch.services = preset.services.map(s=>({...s, id: uid()}));
    }
    updateProfile(p.id, patch);
  });

  ['c_primary','c_secondary','c_bg','c_text'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('input', debounce(()=>{
      const cur = loadAll()[p.id];
      const map = {c_primary:'primary', c_secondary:'secondary', c_bg:'bg', c_text:'text'};
      cur.theme[map[id]] = el.value;
      saveProfile(cur);
    }, 150));
  });
  document.querySelectorAll('.style-toggle .chip').forEach(chip=>{
    chip.onclick = ()=>{
      const cur = loadAll()[p.id]; cur.theme.style = chip.dataset.style; saveProfile(cur);
      renderEditor(document.getElementById('app'), cur);
    };
  });

  document.querySelectorAll('#dayPicker .chip').forEach(chip=>{
    chip.onclick = ()=>{
      const cur = loadAll()[p.id];
      const d = parseInt(chip.dataset.day,10);
      const days = new Set(cur.availability.days);
      days.has(d) ? days.delete(d) : days.add(d);
      cur.availability.days = [...days].sort();
      saveProfile(cur);
      renderEditor(document.getElementById('app'), cur);
    };
  });
  const aStart = document.getElementById('a_start'), aEnd = document.getElementById('a_end'), aSlot = document.getElementById('a_slot');
  [aStart,aEnd].forEach(el=>{ if(!el) return; el.addEventListener('input', debounce(()=>{
    const cur = loadAll()[p.id]; cur.availability.start=aStart.value; cur.availability.end=aEnd.value; saveProfile(cur);
  },250)); });
  if(aSlot) aSlot.addEventListener('change', ()=>{
    const cur = loadAll()[p.id]; cur.availability.slot = parseInt(aSlot.value,10); saveProfile(cur);
  });
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function renderPublicPage(app, p){
  const th = p.theme;
  const bg = th.style==='gradient' ? `linear-gradient(160deg, ${th.bg}, ${shade(th.bg, th.primary)})` : th.bg;

  if(p.deleted){

      <div class="center-msg"><div class="em">🚫</div><h2>Profile unavailable</h2><p style="opacity:.75;">This profile has been removed by its owner.</p></div>
    </div>`; return;
  }
  if(p.locked){
    app.innerHTML = `<div class="profile-shell" style="background:${th.bg}; color:${th.text}; min-height:100vh;">
      <div class="center-msg"><div class="em">🔒</div><h2>This link is locked</h2><p style="opacity:.75;">The owner has temporarily disabled this profile.</p></div>
    </div>`; return;
  }

  const logo = p.logoUrl ? `<img src="${esc(p.logoUrl)}">` : (p.logoInitial || (p.businessName ? p.businessName[0].toUpperCase() : '★'));
  const linksHtml = p.links.map(l=>{
    const meta = LINK_TYPES[l.type] || LINK_TYPES.custom;
    return `<a class="link-btn" style="background:${th.style==='solid'?'rgba(0,0,0,.05)':'rgba(255,255,255,.14)'}; color:${th.text}; border:1px solid ${th.style==='solid'?'rgba(0,0,0,.08)':'rgba(255,255,255,.18)'};"

      <span>${esc(l.label) || meta.label}</span>
    </a>`;
  }).join('');

  const hasBooking = p.services.length>0;
  const waLink = p.links.find(l=>l.type==='whatsapp');
  const phoneLink = p.links.find(l=>l.type==='phone');
  const emailLink = p.links.find(l=>l.type==='email');

  app.innerHTML = `<div class="profile-shell" style="background:${bg}; color:${th.text}; min-height:100vh;">
    <div class="profile-hero">
      <div class="profile-logo" style="background:${th.style==='solid'?'rgba(0,0,0,.06)':'rgba(255,255,255,.15)'}; color:${th.text};">${logo}</div>
      <div class="profile-name">${esc(p.businessName) || 'Business name'}</div>
      ${p.tagline ? `<div class="profile-tagline">${esc(p.tagline)}</div>` : ''}
    </div>
    <div class="profile-body">
      ${p.bio ? `<div class="profile-bio">${esc(p.bio)}</div>` : ''}
      ${linksHtml ? `<div class="link-list">${linksHtml}</div>` : ''}
      ${hasBooking ? `<div class="section-title">Book an appointment</div>
        <div class="book-card" id="bookCard" style="background:${th.style==='solid'?'rgba(0,0,0,.05)':'rgba(255,255,255,.10)'};"></div>` : ''}
      <div class="foot-mark">Made with MyPage</div>
    </div>
  </div>`;

  if(hasBooking) mountBooking(document.getElementById('bookCard'), p, th, {waLink, phoneLink, emailLink});
}

function shade(hex, mix){
  try{
    const h = c => parseInt(c,16);
    const a = hex.replace('#',''), b = mix.replace('#','');
    const r = Math.round((h(a.slice(0,2))*0.7 + h(b.slice(0,2))*0.3));
    const g = Math.round((h(a.slice(2,4))*0.7 + h(b.slice(2,4))*0.3));
    const bl = Math.round((h(a.slice(4,6))*0.7 + h(b.slice(4,6))*0.3));
    return `rgb(${r},${g},${bl})`;
  }catch(e){ return hex; }
}

/* ---- Booking widget ---- */
function mountBooking(el, p, th, contacts){
  const state = { serviceId: p.services[0]?.id, date: '', time: '' };
  const days = p.availability.days;

  function slotsFor(dateStr){
    if(!dateStr) return [];
    const d = new Date(dateStr+'T00:00:00');
    if(!days.includes(d.getDay())) return [];
    const [sh,sm] = p.availability.start.split(':').map(Number);
    const [eh,em] = p.availability.end.split(':').map(Number);
    let cur = sh*60+sm; const end = eh*60+em; const out = [];
    const now = new Date(); const isToday = dateStr === now.toISOString().slice(0,10);
    const nowMin = now.getHours()*60 + now.getMinutes();
    while(cur + p.availability.slot <= end){
      if(!isToday || cur > nowMin) out.push(cur);
      cur += p.availability.slot;
    }
    return out;
  }
  function fmt(min){ const h=Math.floor(min/60), m=min%60; const ap=h>=12?'PM':'AM'; const h12=((h+11)%12)+1; return `${h12}:${String(m).padStart(2,'0')} ${ap}`; }

  function paint(){
    const svc = p.services.find(s=>s.id===state.serviceId);
    const slots = slotsFor(state.date);
    el.innerHTML = `
      <div class="svc-pick">${p.services.map(s=>`<div class="svc-opt ${s.id===state.serviceId?'selected':''}" data-svc="${s.id}" style="color:${th.text};">${esc(s.name)} · ${s.duration}m</div>`).join('')}</div>
      <div class="field" style="margin-bottom:10px;"><input class="pf-input" type="date" id="bk_date" min="${new Date().toISOString().slice(0,10)}" value="${state.date}"></div>
      ${state.date ? (slots.length ? `<div class="slot-grid">${slots.map(m=>`<div class="slot ${m===state.time?'selected':''}" data-slot="${m}" style="color:${th.text};">${fmt(m)}</div>`).join('')}</div>` : `<p style="font-size:13px; opacity:.75; margin:4px 0 14px;">No slots on this date — try another day.</p>`) : ''}
      <input class="pf-input" id="bk_name" placeholder="Your name">
      <input class="pf-input" id="bk_contact" placeholder="Phone or email">
      <button class="book-submit" id="bk_submit" style="background:${th.primary}; color:#fff;">Request appointment</button>
    `;
    el.querySelectorAll('.svc-opt').forEach(o=> o.onclick = ()=>{ state.serviceId=o.dataset.svc; paint(); });
    const dateEl = document.getElementById('bk_date');
    dateEl.onchange = ()=>{ state.date = dateEl.value; state.time=''; paint(); };
    el.querySelectorAll('.slot').forEach(s=> s.onclick = ()=>{ state.time = parseInt(s.dataset.slot,10); paint(); });
    document.getElementById('bk_submit').onclick = ()=>{
      const name = document.getElementById('bk_name').value.trim();
      const contact = document.getElementById('bk_contact').value.trim();
      if(!name || !contact){ toast('Add your name and contact info'); return; }
      if(!state.date || (slots.length && state.time===undefined) ){ /* allow if no slots concept */ }
      const timeText = state.time!==undefined && state.time!=='' ? fmt(state.time) : '';
      const msg = `Hi ${p.businessName || ''}! I'd like to book "${svc?svc.name:''}"${state.date?` on ${state.date}`:''}${timeText?` at ${timeText}`:''}.\nName: ${name}\nContact: ${contact}`;
      sendBooking(msg, contacts);
    };
  }
  paint();
}
function sendBooking(msg, contacts){
  if(contacts.waLink){
    window.open('https://wa.me/'+contacts.waLink.value.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(msg), '_blank');
  } else if(contacts.emailLink){
    window.open('mailto:'+contacts.emailLink.value+'?subject='+encodeURIComponent('Appointment request')+'&body='+encodeURIComponent(msg), '_blank');
  } else if(contacts.phoneLink){
    navigator.clipboard?.writeText(msg);
    toast('Details copied — call to confirm your booking');
  } else {
    navigator.clipboard?.writeText(msg);
    toast('Details copied to clipboard');
  }
}

/* ============================= INIT ============================= */
route();
</script>
