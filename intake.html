<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tap&amp;Go — Profile Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161A20; --paper:#EEF1F6; --panel:#FFFFFF; --line:#C9D0DC; --muted:#4F5766;
  --brass:#C8842A; --on-brass:#161A20; --teal:#1F6B66; --plum:#6E4C6B; --danger:#B3402E; --ok-bg:#E3F3F1;
  --font-head:'Space Grotesk', system-ui, sans-serif;
  --font-body:'Inter', system-ui, -apple-system, sans-serif;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --ink:#ECEEF3; --paper:#14171D; --panel:#1B1F27; --line:#3A4150; --muted:#9AA2B2; --teal:#5FC3BB; --danger:#F08A78; --ok-bg:#16302F; }
}
:root[data-theme="dark"]{ --ink:#ECEEF3; --paper:#14171D; --panel:#1B1F27; --line:#3A4150; --muted:#9AA2B2; --teal:#5FC3BB; --danger:#F08A78; --ok-bg:#16302F; }
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--paper); color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100%;}
h1,h2,h3{font-family:var(--font-head); font-weight:600; letter-spacing:-0.01em; margin:0; line-height:1.2;}
button,input,select,textarea{font-family:inherit; font-size:16px; color:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--brass); outline-offset:2px;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

.topbar{display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); padding:var(--sp-3) var(--sp-5); border-bottom:1px solid var(--line); background:var(--paper); position:sticky; top:0; z-index:10;}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-head); font-weight:600; font-size:18px; text-decoration:none;}
.mark{width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,var(--brass),var(--plum)); display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px;}
.wrap{max-width:1040px; margin:0 auto; padding:var(--sp-5) var(--sp-4) 96px;}
.lead{margin:0 0 var(--sp-5);}
.lead h1{font-size:clamp(26px,5vw,36px);}
.lead p{color:var(--muted); margin:var(--sp-2) 0 0; max-width:60ch;}

.layout{display:grid; grid-template-columns:minmax(0,1fr); gap:var(--sp-5); align-items:start;}
@media (min-width:900px){ .layout{grid-template-columns:minmax(0,1fr) 340px;} .aside{position:sticky; top:84px;} }

.card{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:var(--sp-5);}
.card + .card{margin-top:var(--sp-4);}
.card h2{font-size:18px; margin-bottom:var(--sp-1);}
.card .sub{color:var(--muted); font-size:14px; margin:0 0 var(--sp-4);}
.step{display:inline-grid; place-items:center; width:24px; height:24px; border-radius:50%; background:var(--ink); color:var(--paper); font-size:13px; font-weight:700; margin-right:8px; vertical-align:2px;}

.field{margin-bottom:var(--sp-4);}
.field:last-child{margin-bottom:0;}
label.l{display:block; font-size:14px; font-weight:600; margin-bottom:6px;}
.req{color:var(--danger);}
.opt{color:var(--muted); font-weight:400;}
input[type=text],input[type=url],input[type=tel],input[type=email],select,textarea{
  width:100%; min-height:44px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper); outline:none; transition:border-color .15s ease, box-shadow .15s ease;}
textarea{min-height:92px; resize:vertical;}
input:focus,select:focus,textarea:focus{border-color:var(--brass); box-shadow:0 0 0 3px color-mix(in srgb,var(--brass) 30%,transparent);}
input[aria-invalid=true],select[aria-invalid=true],textarea[aria-invalid=true]{border-color:var(--danger);}
.hint{font-size:13px; color:var(--muted); margin-top:6px;}
.err{font-size:13px; color:var(--danger); margin-top:6px; font-weight:500; display:none;}
.err.show{display:block;}
.count{float:right;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-3);}
@media (max-width:560px){ .row2{grid-template-columns:1fr;} }

.btn{min-height:44px; padding:10px 18px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); font-weight:600; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, border-color .15s ease, filter .15s ease; text-decoration:none;}
.btn:hover{border-color:var(--muted);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--brass); border-color:var(--brass); color:var(--on-brass);}
.btn-primary:hover{filter:brightness(1.06); border-color:var(--brass);}
.btn-danger{color:var(--danger);}
.btn-sm{min-height:44px; padding:8px 14px; font-size:14px;}
.btn[disabled]{opacity:.55; cursor:not-allowed;}
.icon-btn{width:44px; height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--panel); display:inline-grid; place-items:center; cursor:pointer; flex-shrink:0;}
.icon-btn:hover{border-color:var(--muted);}

.drop{display:flex; align-items:center; gap:var(--sp-4); border:1.5px dashed var(--line); border-radius:14px; padding:var(--sp-4); transition:border-color .15s ease, background .15s ease;}
.drop.over{border-color:var(--brass); background:color-mix(in srgb,var(--brass) 10%,transparent);}
.logo-box{width:84px; height:84px; border-radius:18px; border:1px solid var(--line); background:var(--paper); display:grid; place-items:center; overflow:hidden; flex-shrink:0; color:var(--muted); font-family:var(--font-head); font-size:30px; font-weight:700;}
.logo-box img{width:100%; height:100%; object-fit:cover;}
.seg{display:inline-flex; border:1.5px solid var(--line); border-radius:10px; overflow:hidden; margin-top:var(--sp-3);}
.seg label{position:relative; cursor:pointer; display:block;}
.seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
.seg span{display:flex; align-items:center; min-height:44px; padding:10px 14px; font-size:14px; font-weight:600;}
.seg input:checked + span{background:var(--ink); color:var(--paper);}
.seg input:focus-visible + span{outline:3px solid var(--brass); outline-offset:-3px;}

.linkrow{display:grid; grid-template-columns:150px minmax(0,1fr) 44px; gap:var(--sp-2); margin-bottom:var(--sp-3); align-items:start;}
@media (max-width:560px){ .linkrow{grid-template-columns:minmax(0,1fr) 44px;} .linkrow select{grid-column:1 / 2;} .linkrow .vwrap{grid-column:1 / 3;} .linkrow .icon-btn{grid-column:2; grid-row:1;} }
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px; cursor:pointer; min-height:44px; padding:6px 0;}
.check input{width:22px; height:22px; margin:1px 0 0; accent-color:var(--brass); flex-shrink:0;}
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;}

.summary{border:1.5px solid var(--danger); background:color-mix(in srgb,var(--danger) 8%,var(--panel)); border-radius:14px; padding:var(--sp-4); margin-bottom:var(--sp-4);}
.summary h2{font-size:16px; color:var(--danger); margin-bottom:6px;}
.summary ul{margin:0; padding-left:20px;}
.summary a{font-weight:600;}

/* live preview */
.phone{background:#171A21; color:#fff; border-radius:28px; padding:28px 20px 24px; border:1px solid var(--line); text-align:center; min-height:380px;}
.phone .av{width:84px; height:84px; margin:0 auto 12px; border-radius:50%; overflow:hidden; background:rgba(255,255,255,.12); display:grid; place-items:center; font-family:var(--font-head); font-weight:700; font-size:30px;}
.phone .av img{width:100%; height:100%; object-fit:cover;}
.phone h3{font-size:20px; word-break:break-word;}
.phone .tg{opacity:.8; font-size:14px; margin:4px 0 16px; word-break:break-word;}
.pl{display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.16); margin-bottom:10px; text-align:left; font-size:14px; font-weight:600; min-height:44px;}
.pl .ic{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex-shrink:0;}
.pl span.t{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.aside-note{font-size:13px; color:var(--muted); margin:var(--sp-3) 4px 0; text-align:center;}

.done{text-align:center; padding:var(--sp-6) var(--sp-4);}
.done .tick{width:64px; height:64px; border-radius:50%; background:var(--ok-bg); color:var(--teal); display:grid; place-items:center; margin:0 auto var(--sp-4);}
.code{display:inline-block; font-family:ui-monospace,Menlo,Consolas,monospace; font-weight:700; letter-spacing:.08em; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px 14px; margin:var(--sp-2) 0;}
.progress{height:6px; border-radius:99px; background:var(--line); overflow:hidden; margin-top:var(--sp-3);}
.progress i{display:block; height:100%; width:0; background:var(--brass); transition:width .25s ease;}

/* admin */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:var(--sp-4);}
.tab{min-height:44px; padding:8px 16px; border-radius:99px; border:1.5px solid var(--line); background:transparent; font-weight:600; font-size:14px; color:var(--muted); cursor:pointer; white-space:nowrap;}
.tab[aria-selected=true]{background:var(--ink); color:var(--paper); border-color:var(--ink);}
.req-card{display:grid; grid-template-columns:72px minmax(0,1fr); gap:var(--sp-4);}
@media (max-width:560px){ .req-card{grid-template-columns:56px minmax(0,1fr);} }
.req-card .logo-box{width:72px; height:72px; border-radius:16px; font-size:26px;}
.meta{font-size:13px; color:var(--muted);}
.kv{display:grid; grid-template-columns:110px minmax(0,1fr); gap:4px 12px; font-size:14px; margin:var(--sp-3) 0;}
.kv dt{color:var(--muted);} .kv dd{margin:0; word-break:break-word;}
.acts{display:flex; gap:var(--sp-2); flex-wrap:wrap; margin-top:var(--sp-3);}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:3px 10px; border-radius:99px; border:1px solid var(--line);}
.pill.live{color:var(--teal);} .pill.off{color:var(--muted);}
.linkbox{display:flex; gap:var(--sp-2); flex-wrap:wrap;}
.linkbox input{flex:1; min-width:220px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px;}
.empty{text-align:center; padding:var(--sp-6) var(--sp-4); color:var(--muted); border:1.5px dashed var(--line); border-radius:18px;}
.ov{position:fixed; inset:0; background:rgba(8,10,14,.6); display:grid; place-items:center; padding:var(--sp-4); z-index:50; overflow:auto;}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:var(--sp-5); width:100%; max-width:480px; max-height:92vh; overflow:auto;}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,20px); background:var(--ink); color:var(--paper); padding:12px 18px; border-radius:12px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:60; max-width:90vw;}
.toast.show{opacity:1; transform:translate(-50%,0);}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" aria-label="Tap&amp;Go"><span class="mark" aria-hidden="true">T</span><span>Tap&amp;Go</span></a>
  <a class="btn btn-sm" id="modeLink" href="#review" style="display:none;">Staff inbox</a>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================ helpers ============================ */
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9).padEnd(7,'x');
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const refCode=()=>{ const a=crypto.getRandomValues(new Uint8Array(6)); return Array.from(a,b=>CODE_CHARS[b%CODE_CHARS.length]).join(''); };
let toastT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
try{ const th=localStorage.getItem('tapngo_ui_theme_v1'); if(th) document.documentElement.setAttribute('data-theme',th); }catch(e){}
const NTFY='https://ntfy.sh/';
const STORE_KEY='mepage_profiles_v1';             // same key the Tap&Go builder uses
const INBOX_KEY='tapngo_intake_v1', CFG_KEY='tapngo_intake_cfg', PRIV_KEY='tapngo_intake_priv', GONE_KEY='tapngo_intake_gone';
const jget=(k,d)=>{ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } };
const jset=(k,v)=>{ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } };

/* same options the builder offers */
const LINK_TYPES={
  facebook:{label:'Facebook',ph:'facebook.com/yourpage',icon:'globe'}, instagram:{label:'Instagram',ph:'@yourhandle',icon:'camera'},
  tiktok:{label:'TikTok',ph:'@yourhandle',icon:'note'}, whatsapp:{label:'WhatsApp',ph:'+63 900 000 0000',icon:'chat'},
  phone:{label:'Phone',ph:'+63 900 000 0000',icon:'phone'}, email:{label:'Email',ph:'you@business.com',icon:'mail'},
  website:{label:'Website',ph:'yourbusiness.com',icon:'globe'}, custom:{label:'Other link',ph:'https://…',icon:'link'}
};
const INDUSTRIES={general:'General / Other',salon:'Salon & Beauty',wellness:'Health & Wellness',consulting:'Consulting / Coaching',restaurant:'Restaurant / Catering',fitness:'Fitness / Personal Training',home:'Home Services',events:'Events / Photography'};
const P=d=>`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONS={
  globe:P('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 3 2.7 15 0 18M12 3c-2.7 3-2.7 15 0 18"/>'),
  camera:P('<rect x="3" y="7" width="18" height="13" rx="3"/><circle cx="12" cy="13.5" r="3.4"/><path d="M8 7l1.4-2.4h5.2L16 7"/>'),
  note:P('<path d="M9 18V5l10-2v13"/><circle cx="7" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>'),
  chat:P('<path d="M21 12a8 8 0 1 1-3.6-6.7L21 4l-1.1 3.9A7.96 7.96 0 0 1 21 12Z"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>'),
  phone:P('<path d="M4 4h4l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v4c0 1-1 2-2 2A16 16 0 0 1 2 6c0-1 1-2 2-2Z"/>'),
  mail:P('<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/>'),
  link:P('<path d="M9 15l6-6M8 13l-2.5 2.5a3.5 3.5 0 0 0 5 5L13 18M16 11l2.5-2.5a3.5 3.5 0 0 0-5-5L11 6"/>'),
  plus:P('<path d="M12 5v14M5 12h14"/>'), trash:P('<path d="M5 7h14M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/>'),
  upload:P('<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>'), check:P('<path d="M5 12.5l4.5 4.5L19 7.5"/>'), copy:P('<rect x="8.5" y="8.5" width="11" height="11" rx="2.5"/><path d="M5 15.5H4.5A1.5 1.5 0 0 1 3 14V4.5A1.5 1.5 0 0 1 4.5 3H14a1.5 1.5 0 0 1 1.5 1.5V5"/>')
};
const ic=n=>ICONS[n]||'';

/* ---- link validation / normalising (so staff don't have to fix handles) ---- */
function linkErr(type,v){
  v=(v||'').trim(); if(!v) return 'Add the link, or remove this row';
  if(type==='email') return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?'':'Enter a valid email address';
  if(type==='phone'||type==='whatsapp') return (/^[+\d\s()-]+$/.test(v)&&v.replace(/\D/g,'').length>=7)?'':'Enter a phone number, like +63 900 000 0000';
  if(/^[a-z][a-z0-9+.-]*:/i.test(v)&&!/^https?:\/\//i.test(v)) return 'Links must start with http:// or https://';
  if(['instagram','tiktok','facebook'].includes(type)&&/^@?[\w.]{2,40}$/.test(v)) return '';
  return /^(https?:\/\/)?[^\s./]+(\.[^\s./]+)+(\/\S*)?$/.test(v)?'':'Enter a valid link, like yourbusiness.com';
}
function normLink(type,v){
  v=v.trim();
  if(type==='email'||type==='phone'||type==='whatsapp') return v;
  if(/^@?[\w.]{2,40}$/.test(v)){ const h=v.replace(/^@/,'');
    if(type==='instagram') return 'https://instagram.com/'+h;
    if(type==='tiktok') return 'https://tiktok.com/@'+h;
    if(type==='facebook') return 'https://facebook.com/'+h; }
  return v;
}
function linkHref(type,v){ v=(v||'').trim(); if(!v) return '#';
  if(type==='phone') return 'tel:'+v.replace(/[^+\d]/g,''); if(type==='whatsapp') return 'https://wa.me/'+v.replace(/[^\d]/g,'');
  if(type==='email') return 'mailto:'+v; return /^https?:\/\//i.test(v)?v:'https://'+v; }
const safeLogo=u=>/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u||'')&&u.length<400000?u:'';

/* Anything arriving through the inbox is untrusted: the public key is in the customer link, so anyone holding it can send a hand-made request. Re-validate every field. */
const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function cleanReq(r){
  if(!r||typeof r!=='object') return null;
  const S=(v,n)=>typeof v==='string'?v.trim().slice(0,n):'';
  const id=S(r.id,12); if(!/^[A-Z0-9]{4,12}$/.test(id)) return null;
  const business=S(r.business,60); if(business.length<2) return null;
  const links=(Array.isArray(r.links)?r.links:[]).slice(0,8).map(l=>({type:l&&typeof l.type==='string'&&own(LINK_TYPES,l.type)?l.type:'custom',value:S(l&&l.value,300)}))
    .filter(l=>!linkErr(l.type,l.value)).map(l=>({type:l.type,value:normLink(l.type,l.value)}));
  const c=r.contact&&typeof r.contact==='object'?r.contact:{};
  return {id,at:Number.isFinite(r.at)?r.at:Date.now(),business,tagline:S(r.tagline,80),bio:S(r.bio,280),
    industry:typeof r.industry==='string'&&own(INDUSTRIES,r.industry)?r.industry:'general',logo:safeLogo(r.logo),
    color:/^#[0-9a-fA-F]{6}$/.test(r.color||'')?r.color:'',links,contact:{name:S(c.name,100),phone:S(c.phone,40),email:S(c.email,120)}};
}
/*CRYPTO_START*/
const to64=u=>{ u=new Uint8Array(u); let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
const from64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const RSA={name:'RSA-OAEP',hash:'SHA-256'};
const pubJwk=n=>({kty:'RSA',n,e:'AQAB',alg:'RSA-OAEP-256',ext:true});
async function seal(n,obj){                                   // RSA-OAEP wraps a fresh AES-GCM key; only the staff device can open it
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  const pub=await crypto.subtle.importKey('jwk',pubJwk(n),RSA,false,['encrypt']);
  const wk=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',key));
  return JSON.stringify({k:to64(wk),iv:to64(iv),d:to64(ct)});
}
async function openSealed(privJwk,txt){
  const pk=await crypto.subtle.importKey('jwk',privJwk,RSA,false,['decrypt']), o=JSON.parse(txt);
  const key=await crypto.subtle.importKey('raw',await crypto.subtle.decrypt({name:'RSA-OAEP'},pk,from64(o.k)),'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(o.iv)},key,from64(o.d))));
}
const CHUNK=3000;                                              // ntfy messages cap at 4096 bytes
const chunkSealed=(id,s)=>{ const n=Math.ceil(s.length/CHUNK), out=[]; for(let i=0;i<n;i++) out.push(JSON.stringify({t:'part',id,i,n,s:s.slice(i*CHUNK,(i+1)*CHUNK)})); return out; };
/*CRYPTO_END*/

/* ============================ router ============================ */
function route(){
  const h=location.hash, app=$('app'); document.title='Tap&Go — Profile Intake';
  $('modeLink').style.display='none';
  stopListening();
  if(h==='#review'){ renderAdmin(app); return; }
  const m=h.match(/^#k=([\w-]+)&t=([\w-]+)$/);

function wireForm(){
  const live={f_name:vName,f_cn:vCName,f_cp:vContact,f_ce:vContact};   // once a field shows an error, re-check as they type so it clears at once (no layout jump on blur)
  const bind=(id,key,after)=>$(id).addEventListener('input',e=>{ F[key]=e.target.value; if(after) after(); paintPreview(); if(live[id]&&(e.target.getAttribute('aria-invalid')==='true'||id==='f_cp'||id==='f_ce')&&(id!=='f_cp'&&id!=='f_ce'||$('e_contact').classList.contains('show')||$('e_cp').classList.contains('show')||$('e_ce').classList.contains('show'))) live[id](); });
  bind('f_name','name'); bind('f_tag','tagline'); bind('f_bio','bio',()=>$('c_bio').textContent=F.bio.length+'/280'); bind('f_ind','industry');
  bind('f_cn','cName'); bind('f_cp','cPhone'); bind('f_ce','cEmail');
  $('f_agree').addEventListener('change',e=>{ F.agree=e.target.checked; if(F.agree) setErr('f_agree','e_agree',''); });
  $('f_usecolor').addEventListener('change',e=>{ F.useColor=e.target.checked; $('colorWrap').style.display=F.useColor?'block':'none'; paintPreview(); });
  $('f_color').addEventListener('input',e=>{ F.color=e.target.value; paintPreview(); });
  document.querySelectorAll('input[name=fit]').forEach(r=>r.addEventListener('change',async e=>{ F.logoFit=e.target.value; if(F.file){ await processLogo(F.file); } }));
  // validate on blur
  $('f_name').addEventListener('blur',()=>vName()); $('f_cn').addEventListener('blur',()=>vCName());
  $('f_cp').addEventListener('blur',()=>vContact()); $('f_ce').addEventListener('blur',()=>vContact());
  $('addLink').addEventListener('click',()=>{ if(F.links.length>=8) return; F.links.push({type:'instagram',value:''}); paintLinks(); const r=document.querySelectorAll('#linkRows input'); r[r.length-1].focus(); });
  // logo
  $('f_logo').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) processLogo(f); e.target.value=''; });
  $('logoRm').addEventListener('click',()=>{ F.logo=''; F.file=null; paintLogo(); paintPreview(); });
  const d=$('drop'); ['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{ e.preventDefault(); d.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{ e.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f) processLogo(f); });
  $('form').addEventListener('submit',onSubmit);

function setErr(inputId,errId,msg){ const i=$(inputId), e=$(errId); if(!e) return !msg; e.textContent=msg; e.classList.toggle('show',!!msg); if(i) i.setAttribute('aria-invalid',msg?'true':'false'); return !msg; }
function vName(){ const v=F.name.trim(); return setErr('f_name','e_name', v.length<2?'Enter your business or profile name':''); }
function vCName(){ return setErr('f_cn','e_cn', F.cName.trim().length<2?'Enter your name':''); }
function vContact(){
  const p=F.cPhone.trim(), m=F.cEmail.trim(); let ok=true;
  const pe=p&&!(/^[+\d\s()-]+$/.test(p)&&p.replace(/\D/g,'').length>=7)?'Enter a valid mobile number':'';
  const me=m&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m)?'Enter a valid email address':'';
  ok=setErr('f_cp','e_cp',pe)&ok; ok=setErr('f_ce','e_ce',me)&ok;
  const none=!p&&!m; $('e_contact').textContent=none?'Please add a mobile number or an email so we can reach you.':''; $('e_contact').classList.toggle('show',none);
  return !!ok&&!none;
}

/* logo: resize to 240px JPEG on white (same size the builder uses) */
function processLogo(file){
  F.file=file; setErr('f_logo','e_logo','');
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)){ return setErr('f_logo','e_logo','Please choose a PNG, JPG or WebP image'); }
  if(file.size>8*1024*1024){ return setErr('f_logo','e_logo','That image is over 8 MB — please pick a smaller one'); }
  return new Promise(res=>{
    const r=new FileReader(); r.onerror=()=>{ setErr('f_logo','e_logo','We couldn’t read that file'); res(); };
    r.onload=()=>{ const img=new Image(); img.onerror=()=>{ setErr('f_logo','e_logo','That file doesn’t look like a valid image'); res(); };
      img.onload=()=>{ const S=240, c=document.createElement('canvas'); c.width=S; c.height=S; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,S,S);
        if(F.logoFit==='cover'){ const side=Math.min(img.width,img.height); x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S); }
        else { const k=Math.min(S/img.width,S/img.height), w=img.width*k, h=img.height*k; x.drawImage(img,(S-w)/2,(S-h)/2,w,h); }
        F.logo=c.toDataURL('image/jpeg',0.85); paintLogo(); paintPreview(); res(); };
      img.src=r.result; };
    r.readAsDataURL(file); });
}
function paintLogo(){
  const b=$('logoBox'); b.innerHTML=F.logo?`<img src="${F.logo}" alt="Your logo preview">`:'★'; b.setAttribute('aria-hidden',F.logo?'false':'true');

/* links */
function paintLinks(){
  $('linkRows').innerHTML=F.links.map((l,i)=>`<div class="linkrow">
    <select data-i="${i}" aria-label="Link ${i+1} type">${Object.entries(LINK_TYPES).map(([k,v])=>`<option value="${k}" ${l.type===k?'selected':''}>${v.label}</option>`).join('')}</select>
    <div class="vwrap"><input type="text" data-v="${i}" value="${esc(l.value)}" placeholder="${esc(LINK_TYPES[l.type].ph)}" aria-label="Link ${i+1} value" aria-describedby="le_${i}" inputmode="${l.type==='phone'||l.type==='whatsapp'?'tel':l.type==='email'?'email':'url'}" autocapitalize="off" spellcheck="false"><div class="err" id="le_${i}"></div></div>
    <button type="button" class="icon-btn" data-rm="${i}" aria-label="Remove link ${i+1}" ${F.links.length===1?'disabled':''}>${ic('trash')}</button></div>`).join('');
  $('addLink').style.display=F.links.length>=8?'none':'inline-flex';
  document.querySelectorAll('#linkRows select').forEach(s=>s.addEventListener('change',e=>{ F.links[+e.target.dataset.i].type=e.target.value; paintLinks(); paintPreview(); }));

    inp.addEventListener('blur',()=>vLink(i)); });

function vLink(i){ const l=F.links[i], v=l.value.trim(), msg=(v||F.links.length>1)?linkErr(l.type,v):'';
  const er=$('le_'+i), inp=document.querySelector(`[data-v="${i}"]`); if(!er||!inp) return true;
  er.textContent=msg; er.classList.toggle('show',!!msg); inp.setAttribute('aria-invalid',msg?'true':'false'); return !msg; }

function paintPreview(){
  const col=F.useColor?F.color:'#C8842A', ink=lumOf(col)>0.18?'#161A20':'#FFFFFF';
  const links=F.links.filter(l=>l.value.trim()), nm=F.name.trim();
  $('pv').innerHTML=`<div class="av">${F.logo?`<img src="${F.logo}" alt="">`:esc((nm[0]||'★').toUpperCase())}</div>
    <h3>${esc(nm)||'Your business name'}</h3><div class="tg">${esc(F.tagline.trim())||'Your tagline appears here'}</div>
    ${(links.length?links:[{type:'website',value:'yourbusiness.com'}]).map(l=>{ const m=LINK_TYPES[l.type]; return `<div class="pl"><span class="ic" style="background:${col}; color:${ink};">${ic(m.icon)}</span><span class="t">${esc(m.label)}</span></div>`; }).join('')}`;
}
function lumOf(h){ h=h.replace('#',''); const [r,g,b]=[0,2,4].map(i=>{ let v=parseInt(h.substr(i,2),16)/255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }); return 0.2126*r+0.7152*g+0.0722*b; }

/* submit */
async function onSubmit(e){
  e.preventDefault();
  const problems=[];
  if(!vName()) problems.push(['f_name','Business or profile name']);
  const lv=F.links.map((l,i)=>[i,linkErr(l.type,l.value)]);
  let linksOk=true; lv.forEach(([i,msg])=>{ const inp=document.querySelector(`[data-v="${i}"]`); const er=$('le_'+i); er.textContent=msg; er.classList.toggle('show',!!msg); inp.setAttribute('aria-invalid',msg?'true':'false'); if(msg){ linksOk=false; } });
  if(!linksOk) problems.push(['linkRows','Links']); 
  if(!vCName()) problems.push(['f_cn','Your name']);
  if(!vContact()) problems.push([F.cPhone.trim()?'f_ce':'f_cp','Mobile number or email']);
  if(!F.agree){ setErr('f_agree','e_agree','Please tick this box to continue'); problems.push(['f_agree','Confirmation']); }
  const sum=$('summary');
  if(problems.length){
    sum.innerHTML=`<div class="summary" role="alert"><h2>There’s a problem</h2><ul>${problems.map(([id,l])=>`<li><a href="#${id}" data-focus="${id}">${esc(l)} needs attention</a></li>`).join('')}</ul></div>`;
    sum.querySelectorAll('[data-focus]').forEach(a=>a.addEventListener('click',ev=>{ ev.preventDefault(); let t=$(ev.target.dataset.focus); if(t&&t.id==='linkRows') t=t.querySelector('[aria-invalid=true]')||t.querySelector('input'); if(t) t.focus(); }));
    sum.focus(); sum.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); return;
  }
  sum.innerHTML='';
  if($('f_hp').value){ return renderDone({code:refCode()}); }       // honeypot: pretend it worked
  const links=F.links.filter(l=>l.value.trim()).map(l=>({type:l.type,value:normLink(l.type,l.value)}));
  const req={ id:refCode(), at:Date.now(), business:F.name.trim(), tagline:F.tagline.trim(), bio:F.bio.trim(), industry:F.industry, logo:F.logo,
    color:F.useColor?F.color:'', links, contact:{name:F.cName.trim(), phone:F.cPhone.trim(), email:F.cEmail.trim()} };
  const btn=$('sendBtn'), prog=$('prog'); btn.disabled=true; btn.textContent='Sending…'; prog.style.display='block';
  try{
    const sealed=await seal(F.cfg.n,req);
    F.pending={req,sealed};
    await sendSealed(req,sealed,pct=>prog.firstElementChild.style.width=pct+'%');
    renderDone(req);
  }catch(err){
    btn.disabled=false; btn.textContent='Try sending again'; prog.style.display='none';
    document.querySelectorAll('#sendBox .summary').forEach(x=>x.remove());
    $('sendBox').insertAdjacentHTML('beforeend',`<div class="summary" role="alert" style="margin-top:12px;"><h2>We couldn’t send that</h2>
      <p style="margin:0 0 10px; font-size:14px;">Check your connection and try again. Or save a copy and send it to us directly — it’s encrypted, so it’s safe to share.</p>
      <button type="button" class="btn btn-sm" id="dlCopy">${ic('copy')} Save a copy to send us</button></div>`);
    $('dlCopy').addEventListener('click',()=>downloadCopy(req,F.pending.sealed));
  }
}
async function sendSealed(req,sealed,onPct){
  const parts=chunkSealed(req.id,sealed); let ok=0;
  for(const [i,p] of parts.entries()){
    const r=await fetch(NTFY,{method:'POST',body:JSON.stringify({topic:F.cfg.topic+'-d',message:p})});
    if(!r.ok) throw new Error('send failed'); ok++; onPct(Math.round(ok/(parts.length+1)*100));
  }
  fetch(NTFY,{method:'POST',body:JSON.stringify({topic:F.cfg.topic,title:'New Tap&Go profile request',message:'Open your Tap&Go inbox to review it.',tags:['inbox_tray'],priority:4})}).catch(()=>{});
  onPct(100);
}
function downloadCopy(req,sealed){
  const b=new Blob([JSON.stringify({tapngo:1,id:req.id,sealed})],{type:'application/json'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=`tapngo-request-${req.id}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function renderDone(req){
  const app=$('app'); F=null;

    <div class="code" aria-label="Your reference code">${esc(req.code||req.id)}</div><div class="hint">Keep this reference code in case you need to ask about your request.</div></div>`;
  $('doneCard').focus();
}

      <p class="hint">Got a request file by chat instead? <label style="text-decoration:underline; cursor:pointer; font-weight:600;">Import it<input type="file" id="imp" accept=".json,application/json" class="sr"></label>.</p></section>
    <div style="height:var(--sp-4)"></div>
    ${LAST?`<div class="card" role="status" style="border-color:var(--teal); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:var(--sp-4);"><span><b>${esc(LAST.name)}</b> was added to your Tap&amp;Go builder.</span><a class="btn btn-primary btn-sm" href="index.html#edit/${esc(LAST.pid)}">Open in builder</a></div>`:''}
    <div class="tabs" role="tablist">${[['pending','Pending'],['approved','Approved'],['rejected','Rejected']].map(([k,l])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${adminTab===k}">${l} (${cnt(k)})</button>`).join('')}</div>
    <div id="list"></div>`;
  $('cp').addEventListener('click',()=>{ navigator.clipboard?navigator.clipboard.writeText(link).then(()=>toast('Link copied'),()=>$('custLink').select()):$('custLink').select(); });
  $('imp').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; try{ const j=JSON.parse(await f.text()); if(await ingest(j.sealed)) toast('Request imported'); else toast('That request was already added'); }catch(err){ toast('Couldn’t open that file'); } e.target.value=''; paintList(); refreshCounts(); });
  document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{ adminTab=t.dataset.tab; renderAdmin(app); }));
  paintList(); listen(cfg);
}

function listen(cfg){
  if(!window.EventSource){ return; }
  ES=new EventSource(`${NTFY}${cfg.topic}-d/sse?since=12h`);
  const live=on=>{ const el=$('live'); if(!el) return; el.textContent=on?'● Live':'○ Reconnecting…'; el.className='pill '+(on?'live':'off'); };
  ES.onopen=()=>live(true); ES.onerror=()=>live(false);
  ES.onmessage=async ev=>{
    try{ const m=JSON.parse(ev.data); if(m.event!=='message') return; const p=JSON.parse(m.message); if(p.t!=='part') return;
      const b=PARTS[p.id]=PARTS[p.id]||{n:p.n,s:{}}; b.s[p.i]=p.s;
      if(Object.keys(b.s).length===b.n){ const sealed=Array.from({length:b.n},(_,i)=>b.s[i]).join(''); delete PARTS[p.id];
        if(await ingest(sealed,true)){ paintList(); refreshCounts(); } }
    }catch(e){}
  };
}
async function ingest(sealed,notify){
  const priv=jget(PRIV_KEY,null); if(!priv) return false;
  let r; try{ r=await openSealed(priv,sealed); }catch(e){ return false; }
  r=cleanReq(r); if(!r) return false;
  const gone=jget(GONE_KEY,[]), box=inbox(); if(box[r.id]||gone.includes(r.id)) return false;
  box[r.id]={...r,status:'pending'}; saveInbox(box);
  if(notify){ toast('New request: '+r.business); try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain(); o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.15,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5); o.start(); o.stop(a.currentTime+.5); }catch(e){} }
  return true;
}
function refreshCounts(){ const all=Object.values(inbox()); document.querySelectorAll('.tab').forEach(t=>{ const k=t.dataset.tab; t.textContent=`${{pending:'Pending',approved:'Approved',rejected:'Rejected'}[k]} (${all.filter(r=>r.status===k).length})`; }); }

function paintList(){
  const el=$('list'); if(!el) return;
  const rows=Object.values(inbox()).filter(r=>r.status===adminTab).sort((a,b)=>b.at-a.at);
  if(!rows.length){ el.innerHTML=`<div class="empty">${adminTab==='pending'?'No requests waiting. New ones appear here the moment a customer sends them.':'Nothing here yet.'}</div>`; return; }
  el.innerHTML=rows.map(r=>{ const logo=safeLogo(r.logo), when=new Date(r.at).toLocaleString([], {dateStyle:'medium',timeStyle:'short'});
    return `<article class="card req-card" data-id="${esc(r.id)}"><div class="logo-box">${logo?`<img src="${logo}" alt="">`:esc((r.business[0]||'?').toUpperCase())}</div>
      <div><h2 style="font-size:18px; margin:0;">${esc(r.business)}</h2><div class="meta">${esc(r.tagline)||'No tagline'} · Ref ${esc(r.id)} · ${esc(when)}</div>
      <dl class="kv"><dt>Industry</dt><dd>${esc(INDUSTRIES[r.industry]||'General / Other')}</dd>
        ${r.bio?`<dt>About</dt><dd>${esc(r.bio)}</dd>`:''}
        <dt>Links</dt><dd>${(r.links||[]).map(l=>`<div>${esc((LINK_TYPES[l.type]||LINK_TYPES.custom).label)}: <a href="${esc(linkHref(l.type,l.value))}" target="_blank" rel="noopener noreferrer">${esc(l.value)}</a></div>`).join('')||'—'}</dd>
        ${r.color?`<dt>Brand colour</dt><dd><span style="display:inline-block; width:14px; height:14px; border-radius:4px; background:${/^#[0-9a-fA-F]{6}$/.test(r.color)?r.color:'#ccc'}; vertical-align:-2px; border:1px solid var(--line);"></span> ${esc(r.color)}</dd>`:''}
        <dt>Contact</dt><dd>${esc(r.contact&&r.contact.name)}${r.contact&&r.contact.phone?` · <a href="tel:${esc(r.contact.phone.replace(/[^+\d]/g,''))}">${esc(r.contact.phone)}</a>`:''}${r.contact&&r.contact.email?` · <a href="mailto:${esc(r.contact.email)}">${esc(r.contact.email)}</a>`:''}</dd></dl>
      <div class="acts">${r.status==='pending'?`<button class="btn btn-primary btn-sm" data-act="approve">${ic('check')} Approve &amp; add to builder</button><button class="btn btn-sm" data-act="edit">Edit first</button><button class="btn btn-sm btn-danger" data-act="reject">Reject</button>`
        : r.status==='approved'?`<a class="btn btn-primary btn-sm" href="index.html#edit/${esc(r.profileId||'')}">Open in builder</a><span class="meta" style="align-self:center;">Added to the builder on this device</span>`
        : `<button class="btn btn-sm" data-act="restore">Move back to pending</button><button class="btn btn-sm btn-danger" data-act="delete">Delete</button>`}</div></div></article>`; }).join('');
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act,b.closest('[data-id]').dataset.id)));
}

function act(a,id){
  const box=inbox(), r=box[id]; if(!r) return;
  if(a==='approve'){ const pid=createProfile(r); if(!pid) return; r.status='approved'; r.profileId=pid; saveInbox(box); LAST={name:r.business,pid}; renderAdmin($('app')); }
  else if(a==='reject'){ r.status='rejected'; saveInbox(box); renderAdmin($('app')); }
  else if(a==='restore'){ r.status='pending'; saveInbox(box); renderAdmin($('app')); }
  else if(a==='delete'){ delete box[id]; saveInbox(box); const g=jget(GONE_KEY,[]); g.push(id); jset(GONE_KEY,g); renderAdmin($('app')); }
  else if(a==='edit'){ editModal(r); }
}

/* Build a profile in exactly the shape the Tap&Go builder stores */
function createProfile(r){
  const SLUG='abcdefghijkmnpqrstuvwxyz23456789', sl=Array.from(crypto.getRandomValues(new Uint8Array(7)),b=>SLUG[b%SLUG.length]).join('');
  const color=/^#[0-9a-fA-F]{6}$/.test(r.color||'')?r.color:'#C8842A', id=uid();
  const p={ id, slug:sl, businessName:r.business, tagline:r.tagline||'', bio:r.bio||'', logoUrl:safeLogo(r.logo), industry:INDUSTRIES[r.industry]?r.industry:'general',
    theme:{ primary:color, secondary:'#6E4C6B', bg:'#171A21', text:'#FFFFFF', style:'gradient', font:'Inter', fontHead:'Inter', fontBody:'Inter', textScale:'normal', btn:'soft', shape:'round', photoShape:'round' },
    links:(r.links||[]).map(l=>({id:uid(),type:LINK_TYPES[l.type]?l.type:'custom',label:'',value:String(l.value)})),
    services:[], availability:{days:[1,2,3,4,5],start:'09:00',end:'17:00',slot:30}, showcase:{type:'none',videoUrl:'',posterUrl:'',modelUrl:'',caption:''},
    alertWebhook:'', locked:false, createdAt:Date.now(), updatedAt:Date.now() };
  const all=jget(STORE_KEY,{}); all[id]=p;
  if(!jset(STORE_KEY,all)){ toast('Storage is full — couldn’t add this profile'); return null; }
  return id;
}

function editModal(r){
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-labelledby','mt');
  ov.innerHTML=`<div class="modal"><h2 id="mt" style="margin-bottom:12px;">Edit before approving</h2>
    <div class="field"><label class="l" for="m_n">Business name</label><input type="text" id="m_n" value="${esc(r.business)}" maxlength="60"></div>
    <div class="field"><label class="l" for="m_t">Tagline</label><input type="text" id="m_t" value="${esc(r.tagline)}" maxlength="80"></div>
    <div class="field"><label class="l" for="m_b">About</label><textarea id="m_b" maxlength="280">${esc(r.bio)}</textarea></div>
    <div class="field"><label class="l" for="m_i">Industry</label><select id="m_i">${Object.entries(INDUSTRIES).map(([k,v])=>`<option value="${k}" ${r.industry===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="field"><label class="l" for="m_l">Links <span class="opt">(one per line: type: value)</span></label>
      <textarea id="m_l" style="min-height:120px;" spellcheck="false">${esc((r.links||[]).map(l=>`${l.type}: ${l.value}`).join('\n'))}</textarea>
      <div class="hint">Types: ${Object.keys(LINK_TYPES).join(', ')}</div></div>
    <div class="acts" style="justify-content:flex-end;"><button class="btn" id="m_c">Cancel</button><button class="btn btn-primary" id="m_s">Save</button></div></div>`;
  document.body.appendChild(ov); $('m_n').focus();
  const close=()=>ov.remove(); $('m_c').addEventListener('click',close);
  ov.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  $('m_s').addEventListener('click',()=>{
    const n=$('m_n').value.trim(); if(n.length<2){ toast('Business name is required'); return; }
    const links=$('m_l').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{ const i=s.indexOf(':'); let t=i>0?s.slice(0,i).trim().toLowerCase():'custom', v=i>0?s.slice(i+1).trim():s;
      if(!own(LINK_TYPES,t)){ t='custom'; v=s; } return {type:t,value:v}; }).filter(l=>l.value);
    const good=links.filter(l=>!linkErr(l.type,l.value)).map(l=>({type:l.type,value:normLink(l.type,l.value)})); if(good.length<links.length) toast((links.length-good.length)+' invalid link(s) were removed');
    const box=inbox(); Object.assign(box[r.id],{business:n,tagline:$('m_t').value.trim(),bio:$('m_b').value.trim(),industry:$('m_i').value,links:good}); saveInbox(box); close(); paintList(); toast('Saved');
  });
}

route();
</script>
