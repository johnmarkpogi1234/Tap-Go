function editService(pid,idx){
  const p=loadAll()[pid], s=idx>=0?p.services[idx]:{name:'',duration:30,price:''};
  showModal(`<h3>${idx>=0?'Edit':'Add'} service</h3>
    <div class="field" style="margin-top:14px;"><label>Service name</label><input type="text" id="s_name" value="${esc(s.name)}" placeholder="e.g. Haircut"></div>
    <div class="row2"><div class="field"><label>Duration (min)</label><input type="number" id="s_dur" value="${s.duration}" min="5" step="5"></div>
      <div class="field"><label>Price <span style="font-weight:400;">(optional)</span></label><input type="text" id="s_price" value="${esc(s.price)}" placeholder="e.g. ₱800"></div></div>
    <div class="acts"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveService('${pid}',${idx})">Save</button></div>`);
}
function saveService(pid,idx){
  const name=$('s_name').value.trim(), duration=parseInt($('s_dur').value,10)||30, price=$('s_price').value.trim();
  if(!name){ toast('Name the service first'); return; }
  const p=loadAll()[pid], item={id:idx>=0?p.services[idx].id:uid(), name, duration, price};
  if(idx>=0) p.services[idx]=item; else p.services.push(item);
  saveProfile(p); closeModal(); renderEditor($('app'),p);
}
function removeService(pid,idx){ const p=loadAll()[pid]; p.services.splice(idx,1); saveProfile(p); renderEditor($('app'),p); }

/* ---- Requests tab ---- */
function fmtWhen(b){ if(!b.date) return 'No date given'; const d=new Date(b.date+'T00:00:00');
  return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})+(b.time?' · '+b.time:''); }
function tabRequests(p){
  const list=loadBookings(p.id), col={new:'var(--brass)',confirmed:'var(--teal)',declined:'var(--muted)'};
  const rows=list.map(b=>`<div class="item-row" style="align-items:flex-start;"><div class="ic">${icon('note',17)}</div>
    <div class="info"><div class="t1">${esc(b.name)} · ${esc(b.service)||'Appointment'}</div>
      <div class="t2" style="white-space:normal;">${fmtWhen(b)}${b.duration?` (${b.duration} min)`:''}${b.price?' · '+esc(b.price):''}<br>Contact: ${esc(b.contact)}${b.notes?`<br>Note: ${esc(b.notes)}`:''}<br>
      <span style="opacity:.7;">Requested ${new Date(b.createdAt).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div>
      <div style="font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:${col[b.status]||'var(--muted)'}; margin-top:6px;">${b.status}</div></div>
    <div class="acts" style="flex-direction:column; gap:6px;">
      ${b.status!=='confirmed'?`<button class="btn btn-sm btn-primary" onclick="respondBooking('${p.id}','${b.id}','confirmed')">Confirm</button>`:''}
      ${b.status!=='declined'?`<button class="btn btn-sm btn-ghost" onclick="respondBooking('${p.id}','${b.id}','declined')">Decline</button>`:''}
      <button class="icon-btn" title="Remove" onclick="removeBooking('${p.id}','${b.id}'); renderEditor($('app'),loadAll()['${p.id}'])">${icon('trash')}</button></div></div>`).join('');
  return `<div class="card"><div style="font-weight:600; margin-bottom:4px;">Appointment requests</div>
    <p class="hint" style="margin:0 0 10px;">Full details for each request. <b>Confirm</b> or <b>Decline</b> opens a ready-to-send reply to the customer (email if they gave one, WhatsApp otherwise) — you press send.</p>
    <p class="hint" style="margin:0 0 14px;">${p.alertWebhook?'Instant alerts are on — every request is emailed to you the moment it\'s sent, on any device. ':'Instant alerts aren\'t set up yet (see the Booking tab) — for now, requests reach you only if the customer finishes sending the WhatsApp/email message their booking opens. '}This list itself only fills in on the device that happened to be open when the request came in.</p>
    ${alertStatusHtml(p)}${rows||'<p class="hint">No requests captured on this device yet.</p>'}</div>`;
}
const isEmailAddr=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((s||'').trim());
function respondBooking(pid,bid,kind){
  const p=loadAll()[pid], b=loadBookings(pid).find(x=>x.id===bid);
  updateBooking(pid,bid,{status:kind});
  if(b) notifyCustomer(p,b,kind);
  renderEditor($('app'),loadAll()[pid]);
}
function notifyCustomer(p,b,kind){
  const when=b.date?`${b.date}${b.time?' at '+b.time:''}`:'your requested time';
  const subject=kind==='confirmed'?`Your appointment with ${p.businessName||'us'} is confirmed`:`About your appointment request with ${p.businessName||'us'}`;
  const body=kind==='confirmed'
    ?`Hi ${b.name},\n\nYour appointment is confirmed:\n\nService: ${b.service||'—'}\nWhen: ${when}${b.duration?`\nDuration: ${b.duration} min`:''}${b.price?`\nPrice: ${b.price}`:''}\n\nSee you then!\n${p.businessName||''}`
    :`Hi ${b.name},\n\nThanks for asking about "${b.service||'an appointment'}". Unfortunately we can't confirm ${when} — please reach out and we'll find another time.\n\n${p.businessName||''}`;
  if(isEmailAddr(b.contact)){ window.open('mailto:'+b.contact+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body),'_blank'); toast('Reply email ready to send'); }
  else{ const d=(b.contact||'').replace(/[^\d]/g,''); if(d.length>=8){ window.open('https://wa.me/'+d+'?text='+encodeURIComponent(body),'_blank'); toast('Reply message ready to send'); }
    else{ navigator.clipboard&&navigator.clipboard.writeText(body); toast("Reply copied — the contact wasn't a clear email or phone number"); } }
}

/* ---- Share tab ---- */
function tabShare(p){
  const meta=getMeta(p.id);
  if(!ghReady()) return `<div class="card"><div style="font-weight:600; margin-bottom:6px;">Connect GitHub to get your link</div>
    <p class="hint" style="margin:0 0 14px;">Your link is a short address (like <b>${esc(location.href.split('#')[0])}#${esc(p.slug)}</b>) and your profile is stored as a small file in your GitHub repo. That's also what makes lock and delete work instantly.</p>
    <button class="btn btn-primary btn-sm" onclick="openGithubSetup()">Connect GitHub</button></div>`;
  if(!meta.published) return `<div class="card"><div style="font-weight:600; margin-bottom:6px;">Publish this profile</div>
    <p class="hint" style="margin:0 0 14px;">This creates your short link. After that, every edit you make here goes live automatically.</p>
    <button class="btn btn-primary btn-sm" onclick="doPublish('${p.id}')">Publish &amp; get link</button></div>`;
  const link=publicLink(p);
  return `${p.locked?`<div class="status-banner locked">${icon('lock',15)} Locked — visitors see “this link is locked” and no profile data is public.</div>`:''}
  <div class="card"><div style="font-weight:600; margin-bottom:10px;">Your link</div>
    <div class="link-box"><input readonly value="${esc(link)}" onclick="this.select()"><button class="icon-btn" title="Copy" onclick="copyText(publicLink(loadAll()['${p.id}']))">${icon('copy')}</button></div>
    <p class="hint" style="margin-top:10px;">Anyone with this link can open your page — no account needed. Edits go live within a couple of seconds and appear for visitors within about 20 seconds.</p>
    <div class="addbar">
      <button class="btn btn-sm" onclick="toggleLock('${p.id}')">${icon(p.locked?'unlock':'lock',13)} ${p.locked?'Unlock link':'Lock link'}</button>
      <button class="btn btn-sm" onclick="confirmModal('Generate a new link?','Your current link stops working right away, and everyone who has it will need the new one.','Generate new link',&quot;regenerateLink('${p.id}')&quot;)">${icon('refresh',13)} New link</button>
      <button class="btn btn-sm btn-danger" onclick="confirmModal('Delete this link?','The live page is taken down immediately. Your profile stays in your dashboard as a draft and you can publish it again.','Delete link',&quot;deleteLink('${p.id}')&quot;)">${icon('trash',13)} Delete link</button>
      <button class="btn btn-sm btn-ghost" onclick="publishNow('${p.id}')">Sync now</button>
    </div></div>
  <div class="card"><div style="font-weight:600; margin-bottom:10px;">QR code</div>
    <p class="hint" style="margin:0 0 12px;">Generate a scannable QR code for your Tap &amp; Go profile link.</p>
    <div class="qr-box"><div id="shareQr_${p.id}"></div><button class="btn btn-sm" onclick="makeProfileQr('shareQr_${p.id}',publicLink(loadAll()['${p.id}']))">Generate / refresh QR</button></div>
  </div>
  <div class="card"><div style="font-weight:600; margin-bottom:6px;">Program a physical Tap &amp; Go card</div>
    <p class="hint" style="margin:0 0 12px;">On a compatible Android browser using HTTPS, bring an NFC card close to the phone and write your public profile link directly to it.</p>
    <div class="nfc-status" style="margin-bottom:10px;">Web NFC works only where the browser exposes NDEFReader.</div>
    <button class="btn btn-primary btn-sm" onclick="writeNfcProfile(loadAll()['${p.id}'],publicLink(loadAll()['${p.id}']))">Write profile to NFC card</button>
  </div>
  <div class="card"><div style="font-weight:600; margin-bottom:6px;">Good to know</div>
    <p class="hint" style="margin:0;">Locking replaces the public file with an empty stub, so profile details aren't readable while locked. Since the repo is public, GitHub's file history keeps earlier versions. Don't put anything private in a profile.</p></div>`;
}
async function doPublish(id){
  toast('Publishing…'); await publishNow(id);
  const s=syncStatus[id]||{}; if(s.state==='error') toast('Publish failed: '+s.msg); else toast('Published — your link is ready');
  renderEditor($('app'),loadAll()[id]);
}
async function toggleLock(id){
  const p=updateProfile(id,{locked:!loadAll()[id].locked});
  renderEditor($('app'),p); toast(p.locked?'Locking…':'Unlocking…');
  clearTimeout(pubTimers[id]); await publishNow(id);
  const s=syncStatus[id]||{}; toast(s.state==='error'?'Not synced: '+s.msg:(p.locked?'Link locked — live now':'Link unlocked — live now'));
  renderEditor($('app'),loadAll()[id]);
}
async function regenerateLink(id){
  const p=updateProfile(id,{slug:shortId()});
  clearTimeout(pubTimers[id]); await publishNow(id);
  const s=syncStatus[id]||{}; toast(s.state==='error'?'Not synced: '+s.msg:'New link ready — the old one is dead');
  renderEditor($('app'),loadAll()[id]);
}

  [['sc_video','videoUrl'],['sc_poster','posterUrl'],['sc_model','modelUrl'],['sc_caption','caption']].forEach(([id,key])=>{

      const cur=loadAll()[p.id]; cur.showcase={...(cur.showcase||{type:'none'}), [key]:el.value.trim()}; saveProfile(cur); scRefresh();
    },400));
  });

  /* theme: manual controls */
  const refreshPreview=()=>{ const el=$('themePreview'); if(el) el.innerHTML=miniPreview(loadAll()[p.id]); };
  ['primary','secondary','bg','text'].forEach(k=>{
    const c=$('c_'+k), h=$('h_'+k); if(!c) return;
    const apply=debounce(v=>{ setTheme(p.id,{[k]:v}); refreshPreview(); },120);
    c.addEventListener('input',()=>{ h.value=c.value; apply(c.value); });
    h.addEventListener('input',()=>{ let v=h.value.trim(); if(v && v[0]!=='#') v='#'+v; if(/^#[0-9a-fA-F]{6}$/.test(v)){ c.value=v; apply(v); } });
  });
  document.querySelectorAll('[data-opt]').forEach(el=>el.onclick=()=>renderEditor($('app'),setTheme(p.id,{[el.dataset.opt]:el.dataset.val})));
  document.querySelectorAll('[data-photo-shape]').forEach(el=>el.onclick=()=>renderEditor($('app'),setTheme(p.id,{photoShape:el.dataset.photoShape})));
  document.querySelectorAll('[data-target]').forEach(el=>el.onclick=()=>{ paletteTarget=el.dataset.target;

  /* booking availability */
  document.querySelectorAll('#dayPicker .chip').forEach(chip=>chip.onclick=()=>{
    const cur=loadAll()[p.id], d=parseInt(chip.dataset.day,10), s=new Set(cur.availability.days); s.has(d)?s.delete(d):s.add(d);

/* Load a published profile from GitHub and keep it fresh while the page is open,
   so lock / unlock / delete reach people who already have the link. */
async function fetchPublic(slug){
  const bust='?t='+Date.now(), repo=detectRepo(), urls=[];
  if(repo) urls.push(`https://raw.githubusercontent.com/${repo.owner}/${repo.repo}/HEAD/profiles/${slug}.json${bust}`);
  urls.push(new URL(`profiles/${slug}.json${bust}`, location.href.split('#')[0]).href);
  for(const u of urls){
    try{
      const res=await fetch(u,{cache:'no-store'});
      if(res.status===404) return {status:'removed'};
      if(!res.ok) continue;
      return {status:'ok', data:await res.json()};
    }catch(e){ /* try next source */ }
  }
  return {status:'error'};
}
async function loadPublic(app,slug){
  renderNotice(app,'⏳','Loading…','');
  let last=null;
  const tick=async first=>{
    if(!first&&document.hidden) return;
    const r=await fetchPublic(slug);
    if(r.status==='error'){ if(first) renderNotice(app,'⚠️',"Couldn't load this page","Check your connection and try again."); return; }
    const sig=r.status==='removed'?'removed':JSON.stringify(r.data);
    if(sig===last) return; last=sig;
    if(r.status==='removed') renderNotice(app,'🚫','Page not found','This link is no longer active. The owner may have replaced or removed it.');
    else if(r.data.locked) renderNotice(app,'🔒','This link is locked','The owner has temporarily turned this page off.');
    else renderPublicPage(app,r.data);
  };
  await tick(true);
  watchTimer=setInterval(()=>tick(false),20000);
}

/* ---- Booking widget ---- */
function mountBooking(el,p){
  const contacts={ waLink:(p.links||[]).find(l=>l.type==='whatsapp'), phoneLink:(p.links||[]).find(l=>l.type==='phone'), emailLink:(p.links||[]).find(l=>l.type==='email') };
  const state={ serviceId:p.services[0]&&p.services[0].id, date:'', time:'' };
  const days=p.availability.days, today=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
  function slotsFor(ds){
    if(!ds) return []; const d=new Date(ds+'T00:00:00'); if(!days.includes(d.getDay())) return [];
    const [sh,sm]=p.availability.start.split(':').map(Number), [eh,em]=p.availability.end.split(':').map(Number);
    let cur=sh*60+sm; const end=eh*60+em, out=[], now=new Date(), isToday=ds===today(), nowMin=now.getHours()*60+now.getMinutes();
    while(cur+p.availability.slot<=end){ if(!isToday||cur>nowMin) out.push(cur); cur+=p.availability.slot; } return out;
  }
  const fmt=m=>{ const h=Math.floor(m/60), mm=m%60; return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')} ${h>=12?'PM':'AM'}`; };
  function paint(){
    const svc=p.services.find(s=>s.id===state.serviceId), slots=slotsFor(state.date);
    el.innerHTML=`<div class="svc-pick">${p.services.map(s=>`<div class="svc-opt ${s.id===state.serviceId?'selected':''}" data-svc="${esc(s.id)}">${esc(s.name)} · ${s.duration}m</div>`).join('')}</div>
      <input class="pf-input" type="date" id="bk_date" min="${today()}" value="${state.date}" aria-label="Date">
      ${state.date?(slots.length?`<div class="slot-grid">${slots.map(m=>`<div class="slot ${m===state.time?'selected':''}" data-slot="${m}">${fmt(m)}</div>`).join('')}</div>`:`<p style="font-size:13px; opacity:.75; margin:4px 0 14px;">No slots on this date — try another day.</p>`):''}
      <input class="pf-input" id="bk_name" placeholder="Your name">
      <input class="pf-input" id="bk_contact" placeholder="Email (for a confirmation reply) or phone">
      <input class="pf-input" id="bk_notes" placeholder="Anything the owner should know (optional)">
      <button class="book-submit" id="bk_submit">Request appointment</button>`;
    el.querySelectorAll('.svc-opt').forEach(o=>o.onclick=()=>{ state.serviceId=o.dataset.svc; paint(); });
    $('bk_date').onchange=e=>{ state.date=e.target.value; state.time=''; paint(); };
    el.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{ state.time=parseInt(s.dataset.slot,10); paint(); });
    $('bk_submit').onclick=async()=>{
      const btn=$('bk_submit');
      const name=$('bk_name').value.trim(), contact=$('bk_contact').value.trim(), notes=$('bk_notes').value.trim();
      if(!name||!contact){ toast('Add your name and contact info'); return; }
      const timeText=state.time!==''?fmt(state.time):'';
      const booking={ id:uid(), service:svc?svc.name:'', duration:svc?svc.duration:null, price:svc?svc.price:'', date:state.date, time:timeText, name, contact, notes, status:'new', createdAt:Date.now() };
      saveBookingLocal(p.pid||p.id||'public',booking);
      btn.disabled=true; btn.textContent='Sending…';
      const delivered=await sendBookingAlert(p,booking);
      btn.disabled=false;
      if(delivered){ btn.textContent='Request sent ✓'; toast('Your request was sent — the owner will reply soon.'); }
      else{
        btn.textContent='Request appointment';
        const msg=`Hi ${p.businessName||''}! I'd like to book "${svc?svc.name:''}"${state.date?` on ${state.date}`:''}${timeText?` at ${timeText}`:''}.\nName: ${name}\nContact: ${contact}${notes?`\nNotes: ${notes}`:''}`;
        sendBooking(msg,contacts);
      }
    };
  }
  paint();
}
/* Real-time, no-account-needed delivery: if the owner has an alert endpoint
   (e.g. Formspree) configured, POST the request there so it emails them instantly
   regardless of which device the customer or owner is using. Falls back to
   opening WhatsApp/email/clipboard for the customer to send themselves. */
async function sendBookingWebhook(p,b){
  if(!p.alertWebhook) return false;
  try{
    const res=await fetch(p.alertWebhook,{ method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({ business:p.businessName||'', service:b.service||'', date:b.date||'', time:b.time||'', duration:b.duration||'', price:b.price||'', name:b.name, contact:b.contact, notes:b.notes||'' }) });
    return res.ok;
  }catch(e){ return false; }
}
function sendBooking(msg,c){
  if(c.waLink) window.open('https://wa.me/'+c.waLink.value.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(msg),'_blank');
  else if(c.emailLink) window.open('mailto:'+c.emailLink.value+'?subject='+encodeURIComponent('Appointment request')+'&body='+encodeURIComponent(msg),'_blank');
  else{ navigator.clipboard&&navigator.clipboard.writeText(msg); toast(c.phoneLink?'Details copied — call to confirm your booking':'Details copied to clipboard'); }
}

async function cardJpeg(p2,side,logo,qr){

function makePdf(images,pages){
  const enc=new TextEncoder(), parts=[], offs=[]; let len=0;
  const push=b=>{ if(typeof b==='string') b=enc.encode(b); parts.push(b); len+=b.length; };
  const obj=(n,fn)=>{ offs[n]=len; push(`${n} 0 obj\n`); fn(); push('\nendobj\n'); };
  const fi=3, fp=fi+images.length, pageIds=pages.map((_,i)=>fp+i*2+1);
  push('%PDF-1.4\n');
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pages.length} >>`));
  images.forEach((im,i)=>obj(fi+i,()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`); push(im.bytes); push('\nendstream'); }));

    const cId=fp+i*2, pId=cId+1;
    obj(cId,()=>push(`<< /Length ${pg.length} >>\nstream\n${pg}\nendstream`));
    obj(pId,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << ${images.map((_,k)=>`/Im${k} ${fi+k} 0 R`).join(' ')} >> >> /Contents ${cId} 0 R >>`));

  push(`xref\n0 ${total}\n0000000000 65535 f \n`);

  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);
  return new Blob(parts,{type:'application/pdf'});
}
async function cardPdf(pid){
  const p=loadAll()[pid], c=cardCfg(p);
  if(!c.slots.length){ toast('Select at least one spot on the sheet'); return; }
  toast('Building your PDF…');
  try{
    const [,logo,qr]=await Promise.all([cardFont(p),cardLogo(p),cardQr(p).catch(()=>null)]);
    const p2={...p,card:{...c,size:'us',sq:true}}, land=c.orient==='landscape', both=c.pdfSide==='both';
    const sides=both?['front','back']:[c.pdfSide], imgs=[], pages=[], mx=(595.28-576)/2, my=(841.89-756)/2;
    for(const s of sides) imgs.push(await cardJpeg(p2,s,logo,qr));
    sides.forEach((side,si)=>{
      let out=''; const flip=both&&side==='back';
      c.slots.forEach(n=>{
        const r=Math.floor((n-1)/4); let col=(n-1)%4; if(flip) col=3-col;
        const x=mx+col*144, y=my+r*252, f=v=>v.toFixed(2);
        if(!land) out+=`q 144 0 0 252 ${f(x)} ${f(y)} cm /Im${si} Do Q\n`;
        else if(!flip) out+=`q 0 -252 144 0 ${f(x)} ${f(y+252)} cm /Im${si} Do Q\n`;
        else out+=`q 0 252 -144 0 ${f(x+144)} ${f(y)} cm /Im${si} Do Q\n`;
        if(c.guides) out+=`q 0.6 G 0.3 w ${f(x)} ${f(y)} 144 252 re S Q\n`;

    const a=document.createElement('a'); a.href=URL.createObjectURL(makePdf(imgs,pages));
    a.download=(p.businessName||'tapngo').replace(/[^\w\-]+/g,'-').toLowerCase()+'-card-sheet.pdf';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }catch(e){ toast('Could not build the PDF'); }
}

async function cardDownload(pid,which){
  const p=loadAll()[pid]; toast('Rendering card…');
  const [,logo,qr]=await Promise.all([cardFont(p),cardLogo(p),cardQr(p).catch(()=>null)]);
  for(const side of (which==='both'?['front','back']:[which])){
    const url=URL.createObjectURL(new Blob([cardSvg(p,side,logo,qr,true)],{type:'image/svg+xml;charset=utf-8'}));
    try{
      const img=new Image(); await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; });
      const cv=document.createElement('canvas'); const [dw,dh]=cardDims(cardCfg(p)); cv.width=dw*3; cv.height=dh*3; const g=cv.getContext('2d'); g.drawImage(img,0,0,dw*3,dh*3); g.scale(3,3); g.textAlign='center';
      cardTexts(p,side).forEach(t=>{ g.font=t.font; g.fillStyle=t.color; g.fillText(t.text,t.x,t.y); });
      const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      a.download=(p.businessName||'tapngo').replace(/[^\w\-]+/g,'-').toLowerCase()+'-card-'+side+'.png';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    }catch(e){ toast('Could not render the card image'); }
    URL.revokeObjectURL(url); await new Promise(r=>setTimeout(r,500));
  }
}


/* ============================= LIVE BOOKING ALERTS ============================= */
/* Customers publish to a free ntfy.sh topic; this dashboard listens in real time.
   Customer details are encrypted (RSA-OAEP + AES-GCM) so only this device can read them. */
const NTFY='https://ntfy.sh/', ALERT_STATE={}, alertES={};
const aTo64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const aFrom64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const alertKeyOf=pid=>localStorage.getItem('tapngo_alertkey_'+pid);
async function alertSeal(p,b){
  const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(b)));
  const pub=await crypto.subtle.importKey('jwk',p.alertPub,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
  const wk=await crypto.subtle.encrypt({name:'RSA-OAEP'},pub,await crypto.subtle.exportKey('raw',key));
  return JSON.stringify({k:aTo64(wk),iv:aTo64(iv),d:aTo64(ct)});
}
async function alertOpen(pid,txt){
  const jwk=alertKeyOf(pid); if(!jwk) return null;
  const pk=await crypto.subtle.importKey('jwk',JSON.parse(jwk),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']), o=JSON.parse(txt);
  const key=await crypto.subtle.importKey('raw',await crypto.subtle.decrypt({name:'RSA-OAEP'},pk,aFrom64(o.k)),'AES-GCM',false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:aFrom64(o.iv)},key,aFrom64(o.d))));
}
async function alertPublish(p,b){
  const sum=`${b.service||'Appointment'}${b.date?' · '+b.date:''}${b.time?' '+b.time:''}`;
  const post=o=>fetch(NTFY,{method:'POST',body:JSON.stringify(o)});
  const [r1,r2]=await Promise.all([post({topic:p.alertTopic,title:'New booking request',message:sum,tags:['calendar'],priority:4}),post({topic:p.alertTopic+'-d',message:await alertSeal(p,b)})]);
  return r1.ok||r2.ok;
}
async function sendBookingAlert(p,b){
  const r=await Promise.all([p.alertTopic&&p.alertPub?alertPublish(p,b).catch(()=>false):false, sendBookingWebhook(p,b)]);
  return r.some(Boolean);
}
function alertLive(pid,on){
  ALERT_STATE[pid]=on;
  document.querySelectorAll('.alive').forEach(el=>{ el.textContent=on?'● Live: listening for bookings':'○ Reconnecting…'; el.style.color=on?'var(--teal)':'var(--muted)'; });
}
function alertListen(pid){
  const p=loadAll()[pid]; if(!p||!p.alertTopic||alertES[pid]||!alertKeyOf(pid)||!window.EventSource) return;
  const es=new EventSource(`${NTFY}${p.alertTopic}-d/sse?since=${localStorage.getItem('tapngo_alertseen_'+pid)||'12h'}`);
  alertES[pid]=es; es.onopen=()=>alertLive(pid,true); es.onerror=()=>alertLive(pid,false);
  es.onmessage=async ev=>{
    try{
      const m=JSON.parse(ev.data); if(m.event!=='message') return;
      localStorage.setItem('tapngo_alertseen_'+pid,String(m.time));
      const b=await alertOpen(pid,m.message);
      if(!b||!b.id||loadBookings(pid).some(x=>x.id===b.id)) return;
      saveBookingLocal(pid,{...b,status:'new'}); alertFire(pid,b);
    }catch(e){}
  };
}
function alertBeep(){
  try{ const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain();
    o.frequency.value=880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.18,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6); o.start(); o.stop(a.currentTime+.6); }catch(e){}
}
function alertFire(pid,b){
  toast(`🔔 New booking from ${b.name}`); alertBeep();
  if(window.Notification&&Notification.permission==='granted'){ try{ new Notification('New booking request',{body:`${b.name} · ${b.service||'Appointment'}${b.date?' · '+b.date:''}${b.time?' '+b.time:''}`}); }catch(e){} }
  const t=document.querySelector('#tabs .tab[data-tab="requests"]');
  if(window.__edPid===pid&&t){ if(editorTab==='requests') renderEditor($('app'),loadAll()[pid]); else t.textContent='Requests ('+loadBookings(pid).filter(x=>x.status==='new').length+')'; }
}
async function alertEnable(pid){
  try{
    const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
    const p=loadAll()[pid]; p.alertPub=await crypto.subtle.exportKey('jwk',kp.publicKey);
    p.alertTopic='tapngo-'+Array.from(crypto.getRandomValues(new Uint8Array(12)),x=>x.toString(16).padStart(2,'0')).join('');
    localStorage.setItem('tapngo_alertkey_'+pid,JSON.stringify(await crypto.subtle.exportKey('jwk',kp.privateKey)));
    saveProfile(p); alertListen(pid); renderEditor($('app'),loadAll()[pid]); toast('Live alerts are on');
  }catch(e){ toast('Live alerts need a secure (https) page'); }
}
function alertDisable(pid){
  const p=loadAll()[pid]; delete p.alertTopic; delete p.alertPub; localStorage.removeItem('tapngo_alertkey_'+pid);
  if(alertES[pid]){ alertES[pid].close(); delete alertES[pid]; }
  saveProfile(p); renderEditor($('app'),loadAll()[pid]); toast('Live alerts are off');
}
async function alertTest(pid){
  const p=loadAll()[pid], d=new Date(); toast('Sending a test booking…');
  const b={id:uid(),service:'Test booking',date:new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),time:'2:00 PM',duration:30,price:'',name:'Test Customer',contact:'test@example.com',notes:'This is a test alert',status:'new',createdAt:Date.now()};
  if(!(await alertPublish(p,b).catch(()=>false))) toast('Could not reach the alert service. Check your connection.');
}
function alertAllowNotify(pid){ if(!window.Notification){ toast('This browser does not support pop-up notifications'); return; } Notification.requestPermission().then(()=>renderEditor($('app'),loadAll()[pid])); }
function alertCopy(t){ navigator.clipboard&&navigator.clipboard.writeText(t); toast('Topic copied'); }
function alertSetupHtml(p){
  const on=!!(p.alertTopic&&p.alertPub), has=!!alertKeyOf(p.id), perm=window.Notification?Notification.permission:'denied';
  let body;
  if(!on) body=`<button class="btn btn-primary btn-sm" onclick="alertEnable('${p.id}')">Turn on live alerts</button>`;
  else if(!has) body=`<p class="hint" style="margin:0 0 10px;">Live alerts were set up on another device, so only that device can read them. Turn them off and on again here to move them to this device.</p><button class="btn btn-sm" onclick="alertDisable('${p.id}')">Turn off</button>`;
  else body=`<div class="alive" style="font-size:12.5px; font-weight:700; margin-bottom:10px;"></div>
    <div class="addbar" style="margin-top:0;"><button class="btn btn-sm btn-primary" onclick="alertTest('${p.id}')">Send test alert</button>${perm!=='granted'?`<button class="btn btn-sm" onclick="alertAllowNotify('${p.id}')">Allow pop-up notifications</button>`:''}<button class="btn btn-sm btn-ghost" onclick="alertDisable('${p.id}')">Turn off</button></div>
    <p class="hint" style="margin:10px 0 0;">Want alerts on your phone while this page is closed? Install the free <b>ntfy</b> app and subscribe to <code>${esc(p.alertTopic)}</code> <a href="#" style="color:var(--brass); font-weight:600;" onclick="alertCopy('${esc(p.alertTopic)}'); return false;">Copy</a>. Phone alerts show only the service and time, never the customer's name or contact.</p>`;
  return `<div class="card"><div style="font-weight:600; margin-bottom:4px;">Live booking alerts</div>
    <p class="hint" style="margin:0 0 12px;">See a booking the moment it happens: a sound, a pop-up and a counter on the Requests tab. Free, no account needed. Customer details are encrypted so only this device can read them. Publish your profile (Share tab) so customers' bookings send alerts.</p>${body}</div>`;
}
function alertStatusHtml(p){
  if(p.alertTopic&&alertKeyOf(p.id)){ const on=ALERT_STATE[p.id]; return `<div class="alive" style="font-size:12.5px; font-weight:700; margin:0 0 12px; color:${on?'var(--teal)':'var(--muted)'};">${on?'● Live: listening for bookings':'○ Connecting…'}</div>`; }
  return `<p class="hint" style="margin:0 0 12px;">Turn on live alerts in the Booking tab to see new requests the moment they arrive.</p>`;
}

/* ---------- image processing: validate, downscale, keep transparency, stay small ---------- */
const IMG_LIMITS={ portrait:{max:720,bytes:95000}, logo:{max:480,bytes:48000}, cover:{max:1100,bytes:115000} };
const IMG_MAX_FILE=20*1024*1024;
function validateImageFile(f){
  if(!f) return 'No file was selected.';
  const typeOk=/^image\/(jpeg|png|webp)$/.test(f.type)||(!f.type&&/\.(jpe?g|png|webp)$/i.test(f.name||''));
  if(!typeOk) return 'Please choose a JPG, PNG or WebP image.';
  if(!f.size) return 'That file is empty.';
  if(f.size>IMG_MAX_FILE) return 'That file is over 20 MB — please pick a smaller photo.';
  return '';
}
function loadImageFromFile(f){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(f), img=new Image();
    img.onload=()=>{ URL.revokeObjectURL(url); res(img); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('decode')); };
    img.src=url;
  });
}
function canvasHasAlpha(img){
  const c=document.createElement('canvas'); c.width=c.height=96; const x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(img,0,0,96,96);
  const d=x.getImageData(0,0,96,96).data; for(let i=3;i<d.length;i+=4) if(d[i]<250) return true; return false;
}
function encodeCanvas(c,alpha,kind,cap){
  const tries=alpha
    ? (kind==='logo'?[['image/png'],['image/webp',.9],['image/webp',.8]]:[['image/webp',.9],['image/webp',.8],['image/png']])
    : (kind==='logo'?[['image/png'],['image/jpeg',.92],['image/jpeg',.82]]:[['image/jpeg',.88],['image/jpeg',.8],['image/jpeg',.72],['image/jpeg',.62]]);
  for(const [mime,q] of tries){
    const u=q?c.toDataURL(mime,q):c.toDataURL(mime);
    if(!u.startsWith('data:'+mime)) continue;            // browser couldn't encode this type — try the next
    if(u.length<=cap*1.37) return u;                      // base64 is ~1.37x the binary size
  }
  return null;
}
async function processImageFile(file,kind){
  const bad=validateImageFile(file); if(bad) throw new Error(bad);
  const lim=IMG_LIMITS[kind];
  const img=await loadImageFromFile(file).catch(()=>{ throw new Error("We couldn't read that image — it may be damaged. Try another file."); });
  const w=img.naturalWidth, h=img.naturalHeight; if(!w||!h) throw new Error("We couldn't read that image — try another file.");
  let scale=Math.min(1,lim.max/Math.max(w,h)), alpha=false;
  if(/png|webp/.test(file.type)||!file.type){ try{ alpha=canvasHasAlpha(img); }catch(e){} }
  for(let n=0;n<7;n++){
    const cw=Math.max(1,Math.round(w*scale)), ch=Math.max(1,Math.round(h*scale)), c=document.createElement('canvas'); c.width=cw; c.height=ch;
    const ctx=c.getContext('2d'); ctx.imageSmoothingQuality='high'; ctx.drawImage(img,0,0,cw,ch);
    const out=encodeCanvas(c,alpha,kind,lim.bytes);
    if(out) return {url:out, width:cw, height:ch, alpha, bytes:Math.round(out.length/1.37)};
    scale*=0.8;                                           // still too heavy — shrink and retry
  }
  throw new Error('That image is too detailed to store here — try a smaller or simpler one.');
}
/* Pick a starting crop that keeps the face in frame (uses the browser's face detector when it has one) */
async function brAutoFocus(url){
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
  const nw=img.naturalWidth, nh=img.naturalHeight;
  let x=50, y=nh>nw*1.05?30:(nw>nh*1.05?45:38);          // faces sit in the upper part of a tall photo
  try{
    if('FaceDetector' in window){
      const faces=await new FaceDetector({fastMode:true,maxDetectedFaces:3}).detect(img);
      if(faces&&faces.length){
        const f=faces.sort((a,b)=>b.boundingBox.width-a.boundingBox.width)[0].boundingBox, m=Math.min(nw,nh), W=nw/m, H=nh/m;
        const cx=(f.x+f.width/2)/nw, cy=(f.y+f.height/2)/nh;
        if(W>1.001) x=clamp((cx*W-.5)/(W-1)*100,0,100);
        if(H>1.001) y=clamp((cy*H-.44)/(H-1)*100,0,100); // leave a little headroom above the face
      }
    }
  }catch(e){ /* detector unavailable or blocked — keep the default */ }
  return {x:Math.round(x), y:Math.round(y)};
}

let _brPend=null, _brTimer=null;
function flushBrand(){
  clearTimeout(_brTimer); if(!_brPend) return;

  const cur=loadAll()[pid]; if(!cur) return;
  cur.brand={...normBrand(cur), ...patch}; saveProfile(cur);
}
function brQueue(pid,patch){
  if(_brPend&&_brPend.pid!==pid) flushBrand();
  _brPend=_brPend||{pid,patch:{}}; Object.assign(_brPend.patch,patch);
  clearTimeout(_brTimer); _brTimer=setTimeout(flushBrand,220);
}
function brCommit(pid,patch){
  flushBrand(); const cur=loadAll()[pid]; if(!cur) return false;
  cur.brand={...normBrand(cur), ...patch}; return saveProfile(cur)!==false;
}

        <div class="bp-sub">Overlay</div>${chips('coverImageOverlayType',COVER_OVERLAYS,b.coverImageOverlayType)}
        ${rng('bp_co','Overlay strength','coverImageOverlay',0,85,1,'%')}`
      :drop('cover','Upload a cover image or branded background','Wide images look best · or leave it off for a clean background')}
      <div class="hint">Covers appear in the Executive, Premium Centered and Modern Agent layouts. Executive shows a branded colour band when no cover is set.</div>
      <div id="bpStatus_cover" class="hint" role="status" aria-live="polite"></div></div>

    <div class="card"><div style="font-weight:600; margin-bottom:4px;">Image storage</div>
      <div class="meter" role="progressbar" aria-label="Browser storage used" aria-valuenow="${info.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${info.pct}%"></i></div>
      <p class="hint" style="margin:0;">This profile's images use about ${info.mine} KB. Your browser has roughly ${info.pct}% of its ~5 MB profile storage in use. Photos are automatically resized and compressed so profiles stay fast to publish and load.</p></div>
  </div>
  <aside class="bp-side"><div class="card bp-pv"><div class="bp-pvbar"><div style="font-weight:600;">Live preview</div>
    <div class="seg" role="group" aria-label="Preview size"><button type="button" data-pvmode="mobile" class="${_bpMode==='mobile'?'on':''}" aria-pressed="${_bpMode==='mobile'}">Mobile</button><button type="button" data-pvmode="desktop" class="${_bpMode==='desktop'?'on':''}" aria-pressed="${_bpMode==='desktop'}">Desktop</button></div></div>
    <div class="bp-frame" id="bpFrame"><div class="bp-vp" id="bpVp"><div id="bpPreview">${miniPreview(p)}</div></div></div>
    <p class="hint" style="margin:10px 0 0;">Same renderer as your published page. Open <b>Preview</b> (top right) to see the full page.</p></div></aside>
  </div>`;
}

/* ---- live-update helpers ---- */
function brFmt(el){ return (+el.value).toFixed(+el.dataset.dec||0)+(el.dataset.unit||''); }
function fitPreview(){
  const out=$('bpFrame'), vp=$('bpVp'); if(!out||!vp) return;
  const vw=_bpMode==='desktop'?1040:390; vp.style.width=vw+'px';
  const k=Math.min(1,out.clientWidth/vw); vp.style.transform=`scale(${k})`; out.style.height=Math.ceil(vp.offsetHeight*k)+'px';
}
const BR_FULL=new Set(['showProfileImage','showCompanyLogo','showCoverImage','personName','jobTitle','companyName']);
let _brRaf=0;
function brPaint(full){
  if(!BRW.b) return; const th=normTheme(BRW.p.theme);
  if(full){
    cancelAnimationFrame(_brRaf);
    _brRaf=requestAnimationFrame(()=>{ const el=$('bpPreview'); if(el) el.innerHTML=miniPreview({...BRW.p,brand:BRW.b}); fitPreview(); });
  }else{
    const css=bhVars(BRW.b,th); document.querySelectorAll('#bpPreview .bh').forEach(el=>el.setAttribute('style',css));
    const st=$('bpStagePic'); if(st) st.setAttribute('style',css+' --pw:min(240px,66vw);');
    const ct=document.querySelector('.bp-covertile img'); if(ct) ct.style.objectPosition=`${BRW.b.coverImagePositionX}% ${BRW.b.coverImagePositionY}%`;
    fitPreview();
  }
}
function brRefreshStates(){
  const b=BRW.b, rad=$('bp_rad'), bg=$('bp_bg');
  if(rad) rad.disabled=!(b.profileImageShape==='rounded'||b.profileImageShape==='portrait');
  if(bg) bg.disabled=!b.profileImageBgOn;
  const bc=$('bp_bc'); if(bc) bc.value=b.profileImageBorderColor||normTheme(BRW.p.theme).primary;
  const auto=$('bp_bc_auto'); if(auto){ auto.textContent=b.profileImageBorderColor?'Match my accent':'✓ Matches accent'; auto.classList.toggle('btn-ghost',!b.profileImageBorderColor); }
}
function brSet(patch){
  if(!BRW.b) return; Object.assign(BRW.b,patch); brQueue(BRW.pid,patch);
  brPaint(Object.keys(patch).some(k=>BR_FULL.has(k))); brRefreshStates();
}
function brSyncSliders(){
  ['profileImageZoom','profileImagePositionX','profileImagePositionY'].forEach(k=>{
    const el=document.querySelector(`#bpRoot [data-br="${k}"]`); if(!el) return; el.value=BRW.b[k]; const o=$('o_'+el.id); if(o) o.textContent=brFmt(el);
  });
}
function brZoomBy(d){ brSet({profileImageZoom:clamp(Math.round((BRW.b.profileImageZoom+d)*100)/100,1,3)}); brSyncSliders(); }

/* ---- drag / pinch / keyboard framing on the crop stage ---- */
function wireStage(){
  const el=$('bpStagePic'); if(!el) return; const img=el.querySelector('img'), ptr=new Map(); let start=null, pinch=null;
  const extent=()=>{                                   // how far the zoomed image overflows the frame, in px
    const fw=el.clientWidth, fh=el.clientHeight, nw=img.naturalWidth||1, nh=img.naturalHeight||1, s=Math.max(fw/nw,fh/nh), z=BRW.b.profileImageZoom;
    return {ox:nw*s*z-fw, oy:nh*s*z-fh};
  };
  const dist=()=>{ const a=[...ptr.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1; };
  const rebase=()=>{ const v=[...ptr.values()][0]; start=v?{x:v.x,y:v.y,px:BRW.b.profileImagePositionX,py:BRW.b.profileImagePositionY}:null; };
  el.addEventListener('pointerdown',e=>{
    el.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); el.classList.add('dragging');
    if(ptr.size===1) rebase(); else if(ptr.size===2){ pinch={d:dist(),z:BRW.b.profileImageZoom}; start=null; }
  });
  el.addEventListener('pointermove',e=>{
    if(!ptr.has(e.pointerId)) return; ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size>=2&&pinch){ brSet({profileImageZoom:clamp(Math.round(pinch.z*dist()/pinch.d*100)/100,1,3)}); brSyncSliders(); return; }
    if(!start) return; const ex=extent(), dx=e.clientX-start.x, dy=e.clientY-start.y, patch={};
    if(ex.ox>0.5) patch.profileImagePositionX=Math.round(clamp(start.px-dx*100/ex.ox,0,100));
    if(ex.oy>0.5) patch.profileImagePositionY=Math.round(clamp(start.py-dy*100/ex.oy,0,100));
    if(Object.keys(patch).length){ brSet(patch); brSyncSliders(); }
  });
  const end=e=>{ ptr.delete(e.pointerId); pinch=null; if(ptr.size) rebase(); else{ start=null; el.classList.remove('dragging'); flushBrand(); } };
  el.addEventListener('pointerup',end); el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',e=>{ e.preventDefault(); brZoomBy(-e.deltaY*0.0018); },{passive:false});
  el.addEventListener('keydown',e=>{
    const st=e.shiftKey?8:2; let patch=null;
    if(e.key==='ArrowLeft') patch={profileImagePositionX:clamp(BRW.b.profileImagePositionX-st,0,100)};
    else if(e.key==='ArrowRight') patch={profileImagePositionX:clamp(BRW.b.profileImagePositionX+st,0,100)};
    else if(e.key==='ArrowUp') patch={profileImagePositionY:clamp(BRW.b.profileImagePositionY-st,0,100)};
    else if(e.key==='ArrowDown') patch={profileImagePositionY:clamp(BRW.b.profileImagePositionY+st,0,100)};
    else if(e.key==='+'||e.key==='='){ e.preventDefault(); brZoomBy(.1); return; }
    else if(e.key==='-'||e.key==='_'){ e.preventDefault(); brZoomBy(-.1); return; }
    if(patch){ e.preventDefault(); brSet(patch); brSyncSliders(); }
  });
}

/* ---- uploads ---- */
function brPreviewApply(kind,res,extra,apply){
  const th=normTheme(BRW.p.theme), b={...BRW.b};
  let pv;
  if(kind==='portrait') pv=`<div class="bh-portrait" style="${esc(bhVars({...b,profileImagePositionX:extra.x,profileImagePositionY:extra.y,profileImageZoom:1},th))} --pw:190px;"><img src="${res.url}" alt="Preview of your portrait" draggable="false"></div>`;
  else pv=`<img class="flat" src="${res.url}" alt="Preview of your ${kind}">`;
  showModal(`<h3>Preview</h3><p>This is how your ${kind==='portrait'?'portrait':kind==='logo'?'logo':'cover image'} will be saved (${res.width}×${res.height}px, about ${Math.max(1,Math.round(res.bytes/1024))} KB${res.alpha?', transparency kept':''}).</p>
    <div class="bp-modalpv">${pv}</div><div class="acts"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="button" id="brApplyBtn">Use this image</button></div>`);
  $('brApplyBtn').onclick=()=>{ closeModal(); apply(); };
}
async function brHandleFile(kind,file){
  const st=$('bpStatus_'+kind), say=m=>{ if(st) st.textContent=m; };
  say('Processing image…');
  try{
    const res=await processImageFile(file,kind), extra=kind==='portrait'?await brAutoFocus(res.url):{};
    say(''); brPreviewApply(kind,res,extra,()=>brApplyImage(kind,res,extra));
  }catch(e){ const m=e&&e.message&&e.message!=='decode'?e.message:'Upload failed — please try a different image.'; say(m); toast(m); }
}
function brApplyImage(kind,res,extra){
  const pid=BRW.pid; flushBrand(); const cur=loadAll()[pid]; if(!cur) return;
  const b=normBrand(cur), patch={}; let msg='';
  if(kind==='portrait'){
    Object.assign(patch,{profileImage:res.url,showProfileImage:true,profileImagePositionX:extra.x,profileImagePositionY:extra.y,profileImageZoom:1});
    if(b.headerLayout==='classic'){ patch.headerLayout='centered'; msg='Portrait added — switched to the Premium Centered header to feature it'; } else msg='Portrait updated';
  }else if(kind==='cover'){
    Object.assign(patch,{coverImage:res.url,showCoverImage:true});
    msg=(b.headerLayout==='classic'||b.headerLayout==='minimal')?'Cover saved — pick Centered, Executive or Agent to show it':'Cover updated';
  }else{ cur.logoUrl=res.url; patch.showCompanyLogo=true; msg='Logo updated'; }
  cur.brand={...b,...patch};
  if(saveProfile(cur)===false){ toast("Your browser's storage is full — remove an image or use a smaller one."); return; }
  renderEditor($('app'),loadAll()[pid]); toast(msg);
}
function brRemove(pid,kind){
  flushBrand(); const cur=loadAll()[pid]; if(!cur) return;
  if(kind==='portrait') cur.brand={...normBrand(cur),profileImage:''};
  else if(kind==='cover') cur.brand={...normBrand(cur),coverImage:''};
  else cur.logoUrl='';
  saveProfile(cur); renderEditor($('app'),loadAll()[pid]); toast(kind==='portrait'?'Portrait removed':kind==='cover'?'Cover removed':'Logo removed');
}
function brReset(pid){
  const patch={}; PORTRAIT_KEYS.forEach(k=>{ patch[k]=BRAND_DEFAULTS[k]; });
  if(brCommit(pid,patch)){ renderEditor($('app'),loadAll()[pid]); toast('Portrait settings reset'); }
}

function wireBranding(pid){
  const p=loadAll()[pid]; if(!p) return; BRW={pid,p,b:normBrand(p)};
  const root=$('bpRoot'); if(!root) return;
  root.querySelectorAll('[data-br]').forEach(inp=>{
    const key=inp.dataset.br;
    inp.addEventListener('input',()=>{
      const v=inp.type==='checkbox'?inp.checked:(inp.type==='range'?parseFloat(inp.value):inp.value);
      const o=$('o_'+inp.id); if(o) o.textContent=brFmt(inp); brSet({[key]:v});
    });
    inp.addEventListener('change',flushBrand);
  });
  root.querySelectorAll('[data-brc]').forEach(el=>el.addEventListener('click',()=>{ if(brCommit(pid,{[el.dataset.brc]:el.dataset.val})) renderEditor($('app'),loadAll()[pid]); }));
  root.querySelectorAll('[data-lay]').forEach(el=>el.addEventListener('click',()=>{ if(brCommit(pid,{headerLayout:el.dataset.lay})){ renderEditor($('app'),loadAll()[pid]); toast(BRAND_LAYOUTS[el.dataset.lay].label+' layout'); } }));
  root.querySelectorAll('[data-preset]').forEach(el=>el.addEventListener('click',()=>brApplyPreset(pid,el.dataset.preset)));
  root.querySelectorAll('input[type=file][data-up]').forEach(inp=>inp.addEventListener('change',()=>{ const f=inp.files&&inp.files[0]; inp.value=''; if(f) brHandleFile(inp.dataset.up,f); }));
  root.querySelectorAll('[data-drop]').forEach(z=>{
    ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.add('drag'); }));
    ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{ e.preventDefault(); z.classList.remove('drag'); }));
    z.addEventListener('drop',e=>{ const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) brHandleFile(z.dataset.drop,f); });
  });
  const on=(id,fn)=>{ const el=$(id); if(el) el.addEventListener('click',fn); };
  on('bpRemovePic',()=>confirmModal('Remove your portrait?','The image will be deleted from this profile. You can upload a new one any time.','Remove',`brRemove('${pid}','portrait')`));
  on('bpRemoveLogo',()=>confirmModal('Remove your logo?','The logo will be removed from this profile everywhere it appears.','Remove',`brRemove('${pid}','logo')`));
  on('bpRemoveCov',()=>confirmModal('Remove the cover image?','The cover will be deleted from this profile.','Remove',`brRemove('${pid}','cover')`));
  on('bpResetPic',()=>brReset(pid));
  on('bpZoomIn',()=>brZoomBy(.15)); on('bpZoomOut',()=>brZoomBy(-.15));
  on('bpCenter',()=>{ brSet({profileImagePositionX:50,profileImagePositionY:BRAND_DEFAULTS.profileImagePositionY}); brSyncSliders(); flushBrand(); });
  on('bpLegacy',()=>confirmModal('Move this image to your portrait?','Your current logo/photo becomes your portrait (it was saved small, so a fresh upload will look sharper). The logo slot will be empty.','Move it',`brLegacyToPortrait('${pid}')`));
  const bc=$('bp_bc'); if(bc){ bc.addEventListener('input',()=>brSet({profileImageBorderColor:bc.value})); bc.addEventListener('change',flushBrand); }
  on('bp_bc_auto',()=>{ brSet({profileImageBorderColor:''}); flushBrand(); });
  root.querySelectorAll('[data-pvmode]').forEach(btn=>btn.addEventListener('click',()=>{
    _bpMode=btn.dataset.pvmode; try{ localStorage.setItem('tapngo_bp_mode',_bpMode); }catch(e){}
    root.querySelectorAll('[data-pvmode]').forEach(x=>{ x.classList.toggle('on',x===btn); x.setAttribute('aria-pressed',String(x===btn)); }); fitPreview();
  }));
  wireStage(); brRefreshStates(); fitPreview();
  if(window.ResizeObserver){ const ro=new ResizeObserver(()=>fitPreview()); ro.observe($('bpFrame')); ro.observe($('bpVp')); }
}
function brLegacyToPortrait(pid){
  flushBrand(); const cur=loadAll()[pid]; if(!cur||!(cur.logoUrl||'').startsWith('data:')) return;
  const b=normBrand(cur); cur.brand={...b,profileImage:cur.logoUrl,showProfileImage:true,profileImagePositionX:50,profileImagePositionY:35,profileImageZoom:1,headerLayout:b.headerLayout==='classic'?'centered':b.headerLayout};
  cur.logoUrl=''; if(saveProfile(cur)===false) return; renderEditor($('app'),loadAll()[pid]); toast('Moved to your portrait');
}

/* ============================= INIT ============================= */
spawnParticles($('bgParticles'), window.innerWidth<640?4:9, ['var(--brass)','var(--plum)','var(--teal)','var(--gold-hi,#EBD08D)']);
route();
</script>
